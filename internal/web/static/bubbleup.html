<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleUp - Root Cause Analysis | dogwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon { font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 600; }
        .logo span { color: #71767b; font-size: 0.7rem; margin-left: 0.5rem; }
        .back-link { color: #1d9bf0; text-decoration: none; font-size: 0.8rem; }
        .back-link:hover { text-decoration: underline; }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        /* Analysis Form */
        .analysis-form {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        .form-label { display: block; font-size: 0.75rem; color: #71767b; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #2f3336;
            border: 1px solid #3f4346;
            border-radius: 6px;
            color: #e7e9ea;
            font-size: 0.85rem;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #1d9bf0; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: #1d9bf0; color: white; }
        .btn-primary:hover { background: #1a8cd8; }
        .btn-primary:disabled { background: #2f3336; color: #71767b; cursor: not-allowed; }

        /* Mode Toggle */
        .mode-toggle { display: flex; gap: 0; }
        .mode-btn {
            padding: 0.6rem 1rem;
            background: #2f3336;
            border: 1px solid #3f4346;
            color: #71767b;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .mode-btn:first-child { border-radius: 6px 0 0 6px; }
        .mode-btn:last-child { border-radius: 0 6px 6px 0; border-left: none; }
        .mode-btn.active { background: #1d9bf0; border-color: #1d9bf0; color: white; }
        .mode-btn:hover:not(.active) { background: #3f4346; color: #e7e9ea; }

        /* Results Section */
        .results-section { display: none; }
        .results-section.visible { display: block; }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2f3336;
        }
        .results-title { font-size: 1.1rem; font-weight: 600; }
        .results-meta { display: flex; gap: 1.5rem; }
        .results-stat { text-align: center; }
        .results-stat-value { font-size: 1.5rem; font-weight: 700; font-family: 'SF Mono', Consolas, monospace; }
        .results-stat-value.anomalous { color: #f4212e; }
        .results-stat-value.baseline { color: #00ba7c; }
        .results-stat-value.confidence { color: #1d9bf0; }
        .results-stat-label { font-size: 0.65rem; color: #71767b; text-transform: uppercase; }

        .summary-box {
            background: linear-gradient(135deg, rgba(29,155,240,0.1), transparent);
            border: 1px solid rgba(29,155,240,0.3);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .summary-icon { margin-right: 0.5rem; }

        /* Dimension Cards */
        .dimensions-grid { display: flex; flex-direction: column; gap: 1rem; }

        .dimension-card {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 10px;
            overflow: hidden;
        }
        .dimension-card.top { border-color: #1d9bf0; }

        .dimension-header {
            padding: 1rem 1.25rem;
            background: #1a1f2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dimension-name { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .dimension-name code { background: #2f3336; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .dimension-stats { display: flex; gap: 1rem; }
        .dimension-stat { text-align: right; }
        .dimension-stat-value { font-size: 1.1rem; font-weight: 600; font-family: 'SF Mono', Consolas, monospace; }
        .dimension-stat-label { font-size: 0.6rem; color: #71767b; text-transform: uppercase; }

        .lift-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .lift-badge.high { background: #4a1919; color: #f4212e; }
        .lift-badge.medium { background: #4a3d19; color: #ffd400; }
        .lift-badge.low { background: #1a2d3d; color: #1d9bf0; }

        .dimension-body { padding: 1rem 1.25rem; }

        .top-value-highlight {
            background: rgba(244,33,46,0.1);
            border: 1px solid rgba(244,33,46,0.3);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .top-value-label { color: #71767b; font-size: 0.75rem; }
        .top-value-name { font-weight: 600; font-size: 1rem; color: #f4212e; }
        .top-value-rates { font-size: 0.8rem; color: #e7e9ea; }

        .distribution-chart { height: 120px; margin-top: 1rem; }

        /* Loading State */
        .loading {
            display: none;
            text-align: center;
            padding: 3rem;
            color: #71767b;
        }
        .loading.visible { display: block; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2f3336;
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #71767b;
        }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .empty-state-text { font-size: 0.9rem; }

        /* Recent Results */
        .recent-results {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 10px;
            margin-top: 2rem;
        }
        .recent-header {
            padding: 1rem 1.25rem;
            background: #1a1f2e;
            border-bottom: 1px solid #2f3336;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #71767b;
        }
        .recent-list { max-height: 300px; overflow-y: auto; }
        .recent-item {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #2f3336;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recent-item:hover { background: #1d1f23; }
        .recent-item:last-child { border-bottom: none; }
        .recent-item-info { display: flex; flex-direction: column; gap: 0.25rem; }
        .recent-item-service { font-weight: 500; }
        .recent-item-time { font-size: 0.7rem; color: #71767b; }
        .recent-item-stats { display: flex; gap: 1rem; font-size: 0.75rem; }
        .recent-item-stat { color: #71767b; }
        .recent-item-stat span { color: #e7e9ea; font-weight: 500; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="logo-icon">&#127813;</span>
            <h1>dogwatch</h1>
            <span>BubbleUp Analysis</span>
        </div>
        <a href="/" class="back-link">&larr; Back to Dashboard</a>
    </div>

    <div class="container">
        <!-- Analysis Form -->
        <div class="analysis-form">
            <div class="form-title">
                <span>&#128269;</span> Run Root Cause Analysis
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Service</label>
                    <select id="service" class="form-select">
                        <option value="">All Services</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Time Range</label>
                    <select id="timeRange" class="form-select">
                        <option value="15m">Last 15 minutes</option>
                        <option value="1h" selected>Last hour</option>
                        <option value="6h">Last 6 hours</option>
                        <option value="24h">Last 24 hours</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Analysis Mode</label>
                    <div class="mode-toggle">
                        <button type="button" class="mode-btn active" data-mode="latency">Slow Requests</button>
                        <button type="button" class="mode-btn" data-mode="errors">Errors</button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" id="latencyOptions">
                    <label class="form-label">Latency Threshold</label>
                    <select id="latencyPercentile" class="form-select">
                        <option value="95">p95 (slowest 5%)</option>
                        <option value="99" selected>p99 (slowest 1%)</option>
                        <option value="99.9">p99.9 (slowest 0.1%)</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button type="button" id="analyzeBtn" class="btn btn-primary">Analyze</button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Analyzing spans...</div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="results">
            <div class="results-header">
                <div class="results-title">Analysis Results</div>
                <div class="results-meta">
                    <div class="results-stat">
                        <div class="results-stat-value anomalous" id="anomalousCount">0</div>
                        <div class="results-stat-label">Anomalous</div>
                    </div>
                    <div class="results-stat">
                        <div class="results-stat-value baseline" id="baselineCount">0</div>
                        <div class="results-stat-label">Baseline</div>
                    </div>
                    <div class="results-stat">
                        <div class="results-stat-value confidence" id="confidence">0%</div>
                        <div class="results-stat-label">Confidence</div>
                    </div>
                </div>
            </div>

            <div class="summary-box" id="summary">
                <span class="summary-icon">&#128161;</span>
                <span id="summaryText"></span>
            </div>

            <div class="dimensions-grid" id="dimensionsGrid"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">&#128202;</div>
            <div class="empty-state-text">
                Select a service and time range, then click Analyze to find root causes.
            </div>
        </div>

        <!-- Recent Results -->
        <div class="recent-results" id="recentResults" style="display: none;">
            <div class="recent-header">Recent Analyses</div>
            <div class="recent-list" id="recentList"></div>
        </div>
    </div>

    <script>
        let currentMode = 'latency';
        let charts = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadServices();
            loadRecentResults();

            // Mode toggle
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    document.getElementById('latencyOptions').style.display =
                        currentMode === 'latency' ? 'block' : 'none';
                });
            });

            // Analyze button
            document.getElementById('analyzeBtn').addEventListener('click', runAnalysis);
        });

        async function loadServices() {
            try {
                const resp = await fetch('/api/trace/services');
                const services = await resp.json();
                const select = document.getElementById('service');
                (services || []).forEach(svc => {
                    const opt = document.createElement('option');
                    opt.value = svc;
                    opt.textContent = svc;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Failed to load services:', e);
            }
        }

        async function loadRecentResults() {
            try {
                const resp = await fetch('/api/bubbleup/results');
                const results = await resp.json();
                if (results && results.length > 0) {
                    document.getElementById('recentResults').style.display = 'block';
                    renderRecentResults(results);
                }
            } catch (e) {
                console.error('Failed to load recent results:', e);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            if (!text) return '';
            return String(text).replace(/[&"'<>]/g, c => ({
                '&': '&amp;', '"': '&quot;', "'": '&#39;', '<': '&lt;', '>': '&gt;'
            }[c]));
        }

        function renderRecentResults(results) {
            const list = document.getElementById('recentList');
            list.innerHTML = results.map(r => `
                <div class="recent-item" data-result-id="${escapeAttr(r.id)}" onclick="loadResult(this.dataset.resultId)">
                    <div class="recent-item-info">
                        <div class="recent-item-service">${escapeHtml(r.service) || 'All Services'} - ${escapeHtml(r.mode)}</div>
                        <div class="recent-item-time">${new Date(r.created_at).toLocaleString()}</div>
                    </div>
                    <div class="recent-item-stats">
                        <div class="recent-item-stat">Anomalous: <span>${parseInt(r.anomalous_count) || 0}</span></div>
                        <div class="recent-item-stat">Dimensions: <span>${parseInt(r.dimensions?.length) || 0}</span></div>
                    </div>
                </div>
            `).join('');
        }

        async function loadResult(id) {
            try {
                const resp = await fetch(`/api/bubbleup/${encodeURIComponent(id)}`);
                const result = await resp.json();
                displayResults(result);
            } catch (e) {
                console.error('Failed to load result:', e);
            }
        }

        function getTimeRange() {
            const range = document.getElementById('timeRange').value;
            const now = new Date();
            let start;
            switch (range) {
                case '15m': start = new Date(now - 15 * 60 * 1000); break;
                case '1h': start = new Date(now - 60 * 60 * 1000); break;
                case '6h': start = new Date(now - 6 * 60 * 60 * 1000); break;
                case '24h': start = new Date(now - 24 * 60 * 60 * 1000); break;
                default: start = new Date(now - 60 * 60 * 1000);
            }
            return { start: start.toISOString(), end: now.toISOString() };
        }

        async function runAnalysis() {
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.textContent = 'Analyzing...';

            document.getElementById('loading').classList.add('visible');
            document.getElementById('results').classList.remove('visible');
            document.getElementById('emptyState').style.display = 'none';

            const timeRange = getTimeRange();
            const request = {
                service: document.getElementById('service').value,
                time_start: timeRange.start,
                time_end: timeRange.end,
                mode: currentMode
            };

            if (currentMode === 'latency') {
                request.latency_percentile = parseFloat(document.getElementById('latencyPercentile').value);
            }

            try {
                const resp = await fetch('/api/bubbleup/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });

                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(err);
                }

                const result = await resp.json();
                displayResults(result);
                loadRecentResults();
            } catch (e) {
                alert('Analysis failed: ' + e.message);
                document.getElementById('emptyState').style.display = 'block';
            } finally {
                document.getElementById('loading').classList.remove('visible');
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        function displayResults(result) {
            document.getElementById('results').classList.add('visible');
            document.getElementById('emptyState').style.display = 'none';

            // Update stats
            document.getElementById('anomalousCount').textContent = result.anomalous_count.toLocaleString();
            document.getElementById('baselineCount').textContent = result.baseline_count.toLocaleString();
            document.getElementById('confidence').textContent = (result.confidence * 100).toFixed(0) + '%';
            document.getElementById('summaryText').textContent = result.summary;

            // Render dimensions
            const grid = document.getElementById('dimensionsGrid');
            grid.innerHTML = '';

            // Destroy old charts
            Object.values(charts).forEach(c => c.destroy());
            charts = {};

            if (!result.dimensions || result.dimensions.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-text">No significant dimensional differences found.</div></div>';
                return;
            }

            result.dimensions.forEach((dim, i) => {
                const card = createDimensionCard(dim, i === 0);
                grid.appendChild(card);
            });
        }

        function createDimensionCard(dim, isTop) {
            const card = document.createElement('div');
            card.className = 'dimension-card' + (isTop ? ' top' : '');

            const liftClass = dim.top_value_lift >= 5 ? 'high' : dim.top_value_lift >= 2 ? 'medium' : 'low';
            const topValue = dim.top_value || '';
            const anomalousRate = ((dim.anomalous_distro[topValue] || 0) * 100).toFixed(1);
            const baselineRate = ((dim.baseline_distro[topValue] || 0) * 100).toFixed(1);
            const divergence = parseFloat(dim.divergence) || 0;
            const topValueLift = parseFloat(dim.top_value_lift) || 0;

            // Sanitize dimension name for use as ID (only alphanumeric and underscore)
            const safeCanvasId = 'chart-' + String(dim.dimension || 'unknown').replace(/[^a-z0-9]/gi, '_');

            card.innerHTML = `
                <div class="dimension-header">
                    <div class="dimension-name">
                        ${isTop ? '<span>&#127942;</span>' : ''}
                        <code>${escapeHtml(dim.dimension)}</code>
                    </div>
                    <div class="dimension-stats">
                        <div class="dimension-stat">
                            <div class="dimension-stat-value">${divergence.toFixed(1)}</div>
                            <div class="dimension-stat-label">Divergence</div>
                        </div>
                        <span class="lift-badge ${liftClass}">${topValueLift.toFixed(1)}x lift</span>
                    </div>
                </div>
                <div class="dimension-body">
                    <div class="top-value-highlight">
                        <div>
                            <div class="top-value-label">Top Contributing Value</div>
                            <div class="top-value-name">${escapeHtml(topValue)}</div>
                        </div>
                        <div class="top-value-rates">
                            ${anomalousRate}% anomalous vs ${baselineRate}% baseline
                        </div>
                    </div>
                    <canvas id="${safeCanvasId}" class="distribution-chart"></canvas>
                </div>
            `;

            // Create chart after DOM is ready
            setTimeout(() => {
                const canvas = document.getElementById(safeCanvasId);
                if (canvas) {
                    createDistributionChart(canvas, dim);
                }
            }, 0);

            return card;
        }

        function createDistributionChart(canvas, dim) {
            const allValues = new Set([
                ...Object.keys(dim.anomalous_distro),
                ...Object.keys(dim.baseline_distro)
            ]);

            // Sort by anomalous rate descending, limit to top 10
            const values = Array.from(allValues)
                .sort((a, b) => (dim.anomalous_distro[b] || 0) - (dim.anomalous_distro[a] || 0))
                .slice(0, 10);

            const anomalousData = values.map(v => ((dim.anomalous_distro[v] || 0) * 100).toFixed(1));
            const baselineData = values.map(v => ((dim.baseline_distro[v] || 0) * 100).toFixed(1));

            charts[dim.dimension] = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: values,
                    datasets: [
                        {
                            label: 'Anomalous',
                            data: anomalousData,
                            backgroundColor: 'rgba(244, 33, 46, 0.7)',
                            borderColor: '#f4212e',
                            borderWidth: 1
                        },
                        {
                            label: 'Baseline',
                            data: baselineData,
                            backgroundColor: 'rgba(0, 186, 124, 0.5)',
                            borderColor: '#00ba7c',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#71767b',
                                font: { size: 10 },
                                boxWidth: 12
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#71767b', font: { size: 9 } },
                            grid: { color: '#2f3336' }
                        },
                        y: {
                            ticks: {
                                color: '#71767b',
                                font: { size: 9 },
                                callback: v => v + '%'
                            },
                            grid: { color: '#2f3336' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
