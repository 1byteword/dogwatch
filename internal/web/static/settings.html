<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - dogwatch</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/logo.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --bg-card: #16181c;
            --bg-elevated: #1e2128;
            --border: #2f3336;
            --text: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --success: #00ba7c;
            --error: #f4212e;
            --warning: #ffd400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s ease;
        }

        .tab:hover {
            color: var(--text);
            background: var(--bg-card);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .widget-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            min-height: 600px;
        }

        profile-settings,
        password-settings,
        notification-preferences,
        sampling-dashboard,
        field-extraction {
            display: block;
            width: 100%;
            min-height: 600px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
            <div class="sidebar-header">
                <span class="logo-icon">&#128021;</span>
                <span class="logo-text">DOGWATCH</span>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="sidebar-item" data-tooltip="Dashboard">
                    <span class="icon">&#128200;</span>
                    <span class="label">Dashboard</span>
                </a>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Observability</div>
                    <a href="/traces.html" class="sidebar-item" data-tooltip="Traces">
                        <span class="icon">&#128279;</span>
                        <span class="label">Traces</span>
                    </a>
                    <a href="/logs.html" class="sidebar-item" data-tooltip="Logs">
                        <span class="icon">&#128220;</span>
                        <span class="label">Logs</span>
                    </a>
                    <a href="/query-builder.html" class="sidebar-item" data-tooltip="Query">
                        <span class="icon">&#9889;</span>
                        <span class="label">Query</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Infrastructure</div>
                    <a href="/my-services" class="sidebar-item" data-tooltip="Services">
                        <span class="icon">&#128736;</span>
                        <span class="label">Services</span>
                    </a>
                    <a href="/entities" class="sidebar-item" data-tooltip="Entities">
                        <span class="icon">&#127970;</span>
                        <span class="label">Entities</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Monitoring</div>
                    <a href="/lookout" class="sidebar-item" data-tooltip="Lookout">
                        <span class="icon">&#128065;</span>
                        <span class="label">Lookout</span>
                    </a>
                    <a href="/bubbleup.html" class="sidebar-item" data-tooltip="BubbleUp">
                        <span class="icon">&#128200;</span>
                        <span class="label">BubbleUp</span>
                    </a>
                    <a href="/security.html" class="sidebar-item" data-tooltip="Security">
                        <span class="icon">&#128737;</span>
                        <span class="label">Security</span>
                    </a>
                    <a href="/cost.html" class="sidebar-item" data-tooltip="Cost">
                        <span class="icon">&#128176;</span>
                        <span class="label">Cost</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">System</div>
                    <a href="/admin.html" class="sidebar-item" data-tooltip="Admin">
                        <span class="icon">&#9881;</span>
                        <span class="label">Admin</span>
                    </a>
                    <a href="/settings.html" class="sidebar-item active" data-tooltip="Settings">
                        <span class="icon">&#128295;</span>
                        <span class="label">Settings</span>
                    </a>
                    <a href="/import.html" class="sidebar-item" data-tooltip="Import">
                        <span class="icon">&#128230;</span>
                        <span class="label">Import</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar (Cmd+B)">
                    <span class="icon">&#9664;</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header-compact">
                <div class="header-left">
                    <span class="page-title">Configuration</span>
                </div>
                <div class="header-right"></div>
            </header>

            <div class="container">
                <div class="page-header">
                    <h1>Settings</h1>
                    <p>Manage your profile, preferences, and data configuration</p>
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="profile">Profile</button>
                    <button class="tab" data-tab="password">Password</button>
                    <button class="tab" data-tab="notifications">Notifications</button>
                    <button class="tab" data-tab="sampling">Sampling</button>
                    <button class="tab" data-tab="extraction">Field Extraction</button>
                </div>

                <div id="tab-profile" class="tab-content active">
                    <div class="widget-container">
                        <profile-settings></profile-settings>
                    </div>
                </div>

                <div id="tab-password" class="tab-content">
                    <div class="widget-container">
                        <password-settings></password-settings>
                    </div>
                </div>

                <div id="tab-notifications" class="tab-content">
                    <div class="widget-container">
                        <notification-preferences></notification-preferences>
                    </div>
                </div>

                <div id="tab-sampling" class="tab-content">
                    <div class="widget-container">
                        <sampling-dashboard></sampling-dashboard>
                    </div>
                </div>

                <div id="tab-extraction" class="tab-content">
                    <div class="widget-container">
                        <field-extraction></field-extraction>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Load component scripts -->
    <script src="/js/components/profile-settings.js"></script>
    <script src="/js/components/password-settings.js"></script>
    <script src="/js/components/notification-preferences.js"></script>
    <script src="/js/components/sampling-dashboard.js"></script>
    <script src="/js/components/field-extraction.js"></script>

    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Update tab states
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update content visibility
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const tabId = tab.dataset.tab;
                document.getElementById(`tab-${tabId}`).classList.add('active');

                // Save to localStorage
                localStorage.setItem('settings-active-tab', tabId);
            });
        });

        // Restore saved tab
        const savedTab = localStorage.getItem('settings-active-tab');
        if (savedTab) {
            const tab = document.querySelector(`.tab[data-tab="${savedTab}"]`);
            if (tab) tab.click();
        }

        // Sidebar Resize
        (function() {
            const sidebar = document.getElementById('sidebar');
            const handle = document.getElementById('sidebar-resize-handle');
            const mainContent = document.querySelector('.main-content');

            let isResizing = false;
            let startX, startWidth;

            // Restore saved width
            const savedWidth = localStorage.getItem('sidebar-width');
            if (savedWidth) {
                const width = parseInt(savedWidth);
                if (width <= 56) {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                } else {
                    sidebar.classList.remove('collapsed');
                    sidebar.style.setProperty('--sidebar-width', savedWidth + 'px');
                    mainContent.style.marginLeft = savedWidth + 'px';
                }
            }

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                document.body.classList.add('sidebar-resizing');
                handle.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const diff = e.clientX - startX;
                let newWidth = startWidth + diff;
                if (newWidth < 80) {
                    newWidth = 56;
                    sidebar.classList.add('collapsed');
                } else {
                    sidebar.classList.remove('collapsed');
                    newWidth = Math.min(300, Math.max(120, newWidth));
                }
                sidebar.style.setProperty('--sidebar-width', newWidth + 'px');
                mainContent.style.marginLeft = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.classList.remove('sidebar-resizing');
                    handle.classList.remove('dragging');
                    localStorage.setItem('sidebar-width', sidebar.offsetWidth);
                }
            });

            // Toggle function
            window.toggleSidebar = function() {
                if (sidebar.classList.contains('collapsed')) {
                    sidebar.classList.remove('collapsed');
                    const saved = localStorage.getItem('sidebar-width');
                    const width = (saved && parseInt(saved) > 56) ? saved : 200;
                    sidebar.style.setProperty('--sidebar-width', width + 'px');
                    mainContent.style.marginLeft = width + 'px';
                    localStorage.setItem('sidebar-width', width);
                } else {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                    localStorage.setItem('sidebar-width', 56);
                }
            };

            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
                    e.preventDefault();
                    window.toggleSidebar();
                }
            });
        })();
    </script>
</body>
</html>
