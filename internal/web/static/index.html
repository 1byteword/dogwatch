<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dogwatch - eBPF Observability</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon { font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 600; }
        .logo span { color: #71767b; font-size: 0.7rem; margin-left: 0.5rem; }
        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .status { display: flex; align-items: center; gap: 0.5rem; color: #71767b; font-size: 0.8rem; }
        .status-dot { width: 8px; height: 8px; background: #00ba7c; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 5px; cursor: pointer; font-size: 0.75rem; background: #2f3336; color: #e7e9ea; }
        .btn:hover { background: #3f4346; }
        .btn-primary { background: #1d9bf0; }
        .btn-primary:hover { background: #1a8cd8; }

        /* Unified Badge System */
        .badge { padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; display: inline-block; }
        .badge-lg { padding: 0.2rem 0.5rem; font-size: 0.7rem; }
        .badge-success, .badge-ok, .badge-healthy, .badge-up, .badge-resolved { background: #0d4429; color: #00ba7c; }
        .badge-warning, .badge-pending, .badge-degraded, .badge-acknowledged, .badge-staging { background: #4a3d19; color: #ffd400; }
        .badge-error, .badge-alerting, .badge-unhealthy, .badge-down, .badge-triggered, .badge-critical, .badge-prod { background: #4a1919; color: #f4212e; }
        .badge-info, .badge-dev { background: #1a2d3d; color: #1d9bf0; }
        .badge-muted, .badge-unknown, .badge-no_data { background: #2f3336; color: #71767b; }
        .badge-pulse { animation: badge-pulse 1s infinite; }
        @keyframes badge-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        /* Severity badges */
        .severity-badge { padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
        .severity-critical { background: #4a1919; color: #f4212e; }
        .severity-high { background: #4a2d19; color: #ff6b35; }
        .severity-medium { background: #4a3d19; color: #ffd400; }
        .severity-low { background: #1a2d3d; color: #1d9bf0; }

        /* GridStack customization */
        .grid-stack { background: #0f1419; min-height: calc(100vh - 60px); padding: 6px; }
        .grid-stack-item { padding: 0; }
        .grid-stack-item-content {
            inset: 0;
            position: absolute;
            display: flex;
            flex-direction: column;
        }
        .gs-item-content {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .widget-header {
            padding: 0.6rem 0.8rem;
            background: #1a1f2e;
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
            min-height: 36px;
        }
        .widget-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #71767b; font-weight: 600; }
        .widget-body { padding: 0.8rem; flex: 1; overflow: auto; position: relative; min-height: 0; }
        .widget-body.no-pad { padding: 0; }

        /* Metric widgets */
        .metric-big { font-size: 2rem; font-weight: 700; }
        .metric-bar { height: 6px; background: #2f3336; border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
        .metric-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .metric-bar-fill.cpu { background: linear-gradient(90deg, #1d9bf0, #1d4ed8); }
        .metric-bar-fill.mem { background: linear-gradient(90deg, #00ba7c, #059669); }
        .metric-bar-fill.disk { background: linear-gradient(90deg, #f4212e, #dc2626); }
        .metric-bar-fill.net { background: linear-gradient(90deg, #7c3aed, #6d28d9); }
        .metric-detail { font-size: 0.7rem; color: #71767b; margin-top: 0.4rem; display: flex; justify-content: space-between; }

        /* Stats */
        .stat-big { font-size: 1.8rem; font-weight: 700; }
        .stat-big.error { color: #f4212e; }

        /* Service Map - Redesigned */
        .svcmap-container { position: relative; width: 100%; height: 100%; background: radial-gradient(ellipse at center, #1a1f2e 0%, #0f1419 100%); overflow: hidden; }
        .svcmap-container svg { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 40px); }
        .svcmap-toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .svcmap-controls { display: flex; gap: 6px; align-items: center; }
        .svcmap-controls select, .svcmap-controls button { padding: 6px 10px; font-size: 0.7rem; background: rgba(47,51,54,0.9); border: 1px solid #3f4346; border-radius: 6px; color: #e7e9ea; cursor: pointer; backdrop-filter: blur(4px); }
        .svcmap-controls select:hover, .svcmap-controls button:hover { background: rgba(63,67,70,0.9); border-color: #1d9bf0; }
        .svcmap-controls .btn-icon { padding: 6px 8px; font-size: 0.85rem; }
        .svcmap-stats { position: absolute; top: 10px; left: 10px; font-size: 0.7rem; color: #71767b; background: rgba(15,20,25,0.9); padding: 6px 12px; border-radius: 6px; display: flex; gap: 6px; align-items: center; z-index: 5; backdrop-filter: blur(4px); }
        .svcmap-zoom-controls { position: absolute; bottom: 50px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .svcmap-zoom-controls button { width: 32px; height: 32px; padding: 0; font-size: 1rem; background: rgba(47,51,54,0.9); border: 1px solid #3f4346; border-radius: 6px; color: #e7e9ea; cursor: pointer; }
        .svcmap-zoom-controls button:hover { background: rgba(63,67,70,0.9); border-color: #1d9bf0; }
        .svcmap-legend { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 16px; font-size: 0.65rem; color: #8b949e; background: rgba(15,20,25,0.8); padding: 6px 12px; border-radius: 6px; }
        .svcmap-legend-item { display: flex; align-items: center; gap: 6px; }
        .svcmap-legend-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
        /* Nodes */
        .svcmap-node { cursor: pointer; }
        .svcmap-node:hover { filter: brightness(1.2); }
        .svcmap-main-group { will-change: transform; }
        .svcmap-node-ring { fill: none; stroke-width: 3; opacity: 0.3; }
        .svcmap-node-bg { fill: #1a1f2e; stroke-width: 2; }
        .svcmap-node-healthy .svcmap-node-bg { stroke: #00ba7c; }
        .svcmap-node-healthy .svcmap-node-ring { stroke: #00ba7c; }
        .svcmap-node-degraded .svcmap-node-bg { stroke: #ffd400; }
        .svcmap-node-degraded .svcmap-node-ring { stroke: #ffd400; }
        .svcmap-node-unhealthy .svcmap-node-bg { stroke: #f4212e; }
        .svcmap-node-unhealthy .svcmap-node-ring { stroke: #f4212e; animation: pulse-ring 1.5s ease-out infinite; }
        .svcmap-node-external .svcmap-node-bg { stroke: #7c3aed; }
        .svcmap-node-external .svcmap-node-ring { stroke: #7c3aed; }
        @keyframes pulse-ring { 0% { r: 24; opacity: 0.4; } 100% { r: 36; opacity: 0; } }
        .svcmap-node-icon { font-size: 16px; dominant-baseline: central; text-anchor: middle; }
        .svcmap-node-label { fill: #e7e9ea; font-size: 11px; font-weight: 600; text-anchor: middle; }
        .svcmap-node-metrics { fill: #8b949e; font-size: 9px; text-anchor: middle; font-family: monospace; }
        .svcmap-node-badge { font-size: 8px; font-weight: 600; }
        /* Edges */
        .svcmap-edge { fill: none; stroke-width: 2; stroke-linecap: round; }
        .svcmap-edge-normal { stroke: #3f4346; }
        .svcmap-edge-active { stroke: rgba(29,155,240,0.6); stroke-dasharray: 6 4; animation: edge-flow 0.8s linear infinite; }
        .svcmap-edge-error { stroke: rgba(244,33,46,0.7); stroke-width: 2.5; }
        .svcmap-edge-slow { stroke: rgba(255,212,0,0.6); }
        .svcmap-edge-highlight { stroke: #1d9bf0; stroke-width: 3; filter: drop-shadow(0 0 4px rgba(29,155,240,0.5)); }
        @keyframes edge-flow { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
        .svcmap-edge-hitarea { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
        /* Edge Labels (metrics badges) */
        .svcmap-edge-label-bg { fill: #1a1f2e; rx: 4; }
        .svcmap-edge-label { font-size: 9px; font-family: 'SF Mono', Consolas, monospace; dominant-baseline: central; }
        .svcmap-edge-label-latency { fill: #8b949e; }
        .svcmap-edge-label-rps { fill: #71767b; }
        .svcmap-edge-label-error { fill: #f4212e; }
        /* Tooltip */
        .svcmap-tooltip { position: absolute; background: rgba(26,31,46,0.95); border: 1px solid #3f4346; border-radius: 8px; padding: 12px 16px; font-size: 0.8rem; pointer-events: none; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(8px); min-width: 180px; display: none; }
        .svcmap-tooltip-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #2f3336; }
        .svcmap-tooltip-status { width: 10px; height: 10px; border-radius: 50%; }
        .svcmap-tooltip-title { font-weight: 600; color: #e7e9ea; font-size: 0.9rem; margin-bottom: 8px; }
        .svcmap-tooltip-type { font-size: 0.7rem; color: #71767b; background: #2f3336; padding: 2px 6px; border-radius: 3px; margin-left: auto; }
        .svcmap-tooltip-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(47,51,54,0.5); }
        .svcmap-tooltip-row:last-child { border-bottom: none; }
        .svcmap-tooltip-row span:first-child { color: #71767b; }
        .svcmap-tooltip-value { color: #e7e9ea; font-weight: 500; font-family: 'SF Mono', Consolas, monospace; }
        .svcmap-tooltip-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .svcmap-tooltip-metric { display: flex; flex-direction: column; }
        .svcmap-tooltip-metric-label { font-size: 0.65rem; color: #71767b; text-transform: uppercase; letter-spacing: 0.5px; }
        .svcmap-tooltip-metric-value { font-size: 1rem; font-weight: 600; color: #e7e9ea; font-family: monospace; }
        .svcmap-tooltip-metric-value.error { color: #f4212e; }
        .svcmap-tooltip-metric-value.warning { color: #ffd400; }
        .svcmap-tooltip-metric-value.success { color: #00ba7c; }
        /* Node detail panel */
        .svcmap-detail { position: absolute; top: 50px; right: 10px; width: 280px; background: rgba(26,31,46,0.95); border: 1px solid #3f4346; border-radius: 10px; z-index: 20; box-shadow: 0 8px 32px rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: none; }
        .svcmap-detail.open { display: block; animation: slideIn 0.2s ease; }
        .svcmap-detail-header { padding: 12px 16px; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
        .svcmap-detail-title { font-weight: 600; color: #e7e9ea; }
        .svcmap-detail-close { background: none; border: none; color: #71767b; cursor: pointer; font-size: 1.2rem; padding: 0; }
        .svcmap-detail-close:hover { color: #e7e9ea; }
        .svcmap-detail-body { padding: 12px 16px; max-height: 400px; overflow-y: auto; }
        .svcmap-detail-section { margin-bottom: 16px; }
        .svcmap-detail-section-title { font-size: 0.7rem; color: #71767b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .svcmap-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .svcmap-detail-stat { background: #2f3336; padding: 8px; border-radius: 6px; }
        .svcmap-detail-stat-value { font-size: 1.1rem; font-weight: 600; color: #e7e9ea; }
        .svcmap-detail-stat-label { font-size: 0.65rem; color: #71767b; }
        .svcmap-detail-list { list-style: none; padding: 0; margin: 0; }
        .svcmap-detail-list li { padding: 6px 0; border-bottom: 1px solid #2f3336; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .svcmap-detail-list li:last-child { border-bottom: none; }
        .svcmap-detail-actions { padding: 12px 16px; border-top: 1px solid #2f3336; display: flex; gap: 8px; }
        .svcmap-detail-actions .btn { flex: 1; text-align: center; }

        /* Flame Graph - Redesigned */
        .flamegraph-container { position: relative; width: 100%; height: 100%; background: linear-gradient(180deg, #0f1419 0%, #1a1f2e 100%); display: flex; flex-direction: column; }
        .flamegraph-toolbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #2f3336; align-items: center; flex-shrink: 0; background: rgba(15,20,25,0.8); }
        .flamegraph-search { flex: 1; max-width: 280px; padding: 7px 12px; background: #2f3336; border: 1px solid #3f4346; border-radius: 6px; color: #e7e9ea; font-size: 0.75rem; transition: all 0.2s; }
        .flamegraph-search:focus { outline: none; border-color: #1d9bf0; background: #3f4346; box-shadow: 0 0 0 3px rgba(29,155,240,0.2); }
        .flamegraph-search::placeholder { color: #71767b; }
        .flamegraph-btn-group { display: flex; gap: 0; }
        .flamegraph-btn-group .flamegraph-btn { border-radius: 0; margin-left: -1px; }
        .flamegraph-btn-group .flamegraph-btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
        .flamegraph-btn-group .flamegraph-btn:last-child { border-radius: 0 6px 6px 0; }
        .flamegraph-btn { padding: 7px 12px; background: #2f3336; border: 1px solid #3f4346; border-radius: 6px; color: #e7e9ea; font-size: 0.7rem; cursor: pointer; transition: all 0.15s; font-weight: 500; }
        .flamegraph-btn:hover { background: #3f4346; border-color: #536471; }
        .flamegraph-btn.active { background: linear-gradient(135deg, #1d9bf0, #1a8cd8); border-color: #1d9bf0; color: #fff; }
        .flamegraph-btn-icon { padding: 7px 10px; font-size: 0.85rem; }
        .flamegraph-divider { width: 1px; height: 24px; background: #3f4346; margin: 0 4px; }
        .flamegraph-stats { font-size: 0.7rem; color: #71767b; margin-left: auto; display: flex; gap: 12px; align-items: center; }
        .flamegraph-stat { display: flex; align-items: center; gap: 4px; }
        .flamegraph-stat-value { color: #e7e9ea; font-weight: 600; font-family: 'SF Mono', Consolas, monospace; }
        .flamegraph-stat-label { color: #536471; }
        .flamegraph-breadcrumbs { display: flex; gap: 4px; align-items: center; padding: 6px 12px; background: rgba(47,51,54,0.5); border-bottom: 1px solid #2f3336; font-size: 0.7rem; overflow-x: auto; }
        .flamegraph-breadcrumb { color: #71767b; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.15s; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        .flamegraph-breadcrumb:hover { background: #3f4346; color: #e7e9ea; }
        .flamegraph-breadcrumb.current { color: #1d9bf0; font-weight: 500; cursor: default; }
        .flamegraph-breadcrumb.current:hover { background: transparent; }
        .flamegraph-breadcrumb-sep { color: #536471; font-size: 0.6rem; }
        .flamegraph-view { flex: 1; overflow: auto; position: relative; padding: 8px; }
        .flamegraph-canvas { position: relative; min-height: 100%; }
        .flamegraph-frame { position: absolute; height: 22px; min-width: 1px; cursor: pointer; transition: all 0.12s ease; border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2); }
        .flamegraph-frame:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.3); z-index: 10; }
        .flamegraph-frame-label { position: absolute; left: 6px; right: 6px; top: 4px; font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none; font-weight: 500; }
        .flamegraph-frame.matched { box-shadow: inset 0 0 0 2px #ffd400, 0 0 8px rgba(255,212,0,0.4); z-index: 5; }
        .flamegraph-frame.faded { opacity: 0.25; }
        .flamegraph-frame.diff-added { box-shadow: inset 0 0 0 2px #00ba7c; }
        .flamegraph-frame.diff-removed { box-shadow: inset 0 0 0 2px #f4212e; }
        .flamegraph-tooltip { position: fixed; background: rgba(26,31,46,0.98); border: 1px solid #3f4346; border-radius: 10px; padding: 14px 18px; font-size: 0.8rem; pointer-events: none; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 450px; backdrop-filter: blur(8px); }
        .flamegraph-tooltip-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #2f3336; }
        .flamegraph-tooltip-color { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
        .flamegraph-tooltip-name { font-weight: 600; color: #e7e9ea; word-break: break-all; line-height: 1.3; }
        .flamegraph-tooltip-type { font-size: 0.65rem; color: #71767b; background: #2f3336; padding: 2px 6px; border-radius: 3px; margin-top: 4px; display: inline-block; }
        .flamegraph-tooltip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .flamegraph-tooltip-stat { background: #2f3336; padding: 8px 10px; border-radius: 6px; }
        .flamegraph-tooltip-stat-value { font-size: 1rem; font-weight: 600; color: #e7e9ea; font-family: 'SF Mono', Consolas, monospace; }
        .flamegraph-tooltip-stat-value.hot { color: #f97316; }
        .flamegraph-tooltip-stat-value.warm { color: #ffd400; }
        .flamegraph-tooltip-stat-label { font-size: 0.65rem; color: #71767b; margin-top: 2px; }
        .flamegraph-tooltip-bar { height: 4px; background: #3f4346; border-radius: 2px; margin-top: 12px; overflow: hidden; }
        .flamegraph-tooltip-bar-fill { height: 100%; border-radius: 2px; transition: width 0.2s; }
        .flamegraph-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #71767b; font-size: 0.85rem; gap: 12px; }
        .flamegraph-empty-icon { font-size: 2.5rem; opacity: 0.5; }
        .flamegraph-minimap { position: absolute; bottom: 12px; right: 12px; width: 180px; height: 60px; background: rgba(26,31,46,0.9); border: 1px solid #3f4346; border-radius: 8px; overflow: hidden; z-index: 15; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .flamegraph-minimap-viewport { position: absolute; background: rgba(29,155,240,0.2); border: 1px solid rgba(29,155,240,0.5); cursor: move; }
        .flamegraph-legend { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 12px; font-size: 0.65rem; color: #71767b; background: rgba(15,20,25,0.9); padding: 6px 12px; border-radius: 6px; z-index: 15; }
        .flamegraph-legend-item { display: flex; align-items: center; gap: 5px; }
        .flamegraph-legend-color { width: 12px; height: 12px; border-radius: 3px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th { text-align: left; padding: 0.5rem; color: #71767b; font-weight: 500; font-size: 0.65rem; text-transform: uppercase; border-bottom: 1px solid #2f3336; }
        td { padding: 0.5rem; border-bottom: 1px solid #2f3336; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #1d1f23; }
        .method { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: 600; font-size: 0.6rem; }
        .method.GET { background: #1d4ed8; color: #93c5fd; }
        .method.POST { background: #059669; color: #6ee7b7; }
        .method.PUT { background: #d97706; color: #fcd34d; }
        .method.DELETE { background: #dc2626; color: #fca5a5; }
        .path { font-family: monospace; color: #1d9bf0; font-size: 0.7rem; }
        .latency { font-family: monospace; }
        .latency.good { color: #00ba7c; }

                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    Continue with GitHub

                <button class="oauth-btn microsoft" onclick="startOAuth('microsoft')" style="display: none;">
                    <svg viewBox="0 0 24 24"><rect fill="#F25022" x="1" y="1" width="10" height="10"/><rect fill="#00A4EF" x="1" y="13" width="10" height="10"/><rect fill="#7FBA00" x="13" y="1" width="10" height="10"/><rect fill="#FFB900" x="13" y="13" width="10" height="10"/></svg>
                    Continue with Microsoft
                </button>
            </div>
            <div id="oauth-loading" class="oauth-loading">Loading SSO providers...</div>

            <div class="login-divider" id="login-divider" style="display: none;"><span>or sign in with email</span></div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <span class="logo-icon">&#128021;</span>
            <h1>dogwatch<span>eBPF Dashboard</span></h1>
        </div>
        <div class="header-controls">
            <div class="status">
                <div class="status-dot"></div>
                <span id="last-update">Connecting...</span>
            </div>
            <select id="dashboard-select" class="form-select" style="width: 150px; padding: 0.4rem; font-size: 0.75rem;" onchange="loadDashboard(this.value)">
                <option value="">Default Layout</option>
            </select>

            <button class="btn" onclick="showDashboardManager()">Dashboards</button>
            <button class="btn" onclick="resetLayout()">Reset Layout</button>

            <!-- User Menu -->
            <div class="user-menu" id="user-menu" style="display: none;">
                <button class="user-menu-btn" onclick="toggleUserMenu()">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <span id="user-name-display">User</span>
                    <span style="font-size: 0.6rem;">&#9660;</span>
                </button>
                <div class="user-menu-dropdown" id="user-menu-dropdown">
                    <div class="user-menu-header">
                        <div class="user-menu-name" id="user-full-name">User</div>
                        <div class="user-menu-email" id="user-email">user@example.com</div>
                        <div class="user-menu-role" id="user-role-badge">viewer</div>
                    </div>
                    <div class="user-menu-item" onclick="showUserSettings()">
                        <span>&#9881;</span> Settings
                    </div>
                    <div class="user-menu-item" onclick="showUserManagement()" id="users-menu-item" style="display: none;">
                        <span>&#128101;</span> Users
                    </div>
                    <div class="user-menu-item" onclick="showTeamManagement()" id="teams-menu-item" style="display: none;">
                        <span>&#128101;</span> Teams
                    </div>
                    <div class="user-menu-item" onclick="showAPIKeyManagement()">
                        <span>&#128273;</span> API Keys
                    </div>
                    <div class="user-menu-item" onclick="showNotificationChannels()">
                        <span>&#128276;</span> Notifications
                    </div>
                    <div class="user-menu-divider"></div>
                    <div class="user-menu-item danger" onclick="handleLogout()">
                        <span>&#10140;</span> Sign Out
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid-stack"></div>

    <script>
        // =====================================
        // Authentication & User Management
        // =====================================
        let currentUser = null;
        let currentOrg = null;

        // Check authentication on page load
        async function checkAuth() {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.ok) {
                    const data = await resp.json();
                    currentUser = data.user;
                    currentOrg = data.org;
                    showAuthenticatedUI();
                    return true;
                }
            } catch (e) {}
            showLoginScreen();
            return false;
        }

        function showLoginScreen() {
            document.getElementById('login-screen').style.display = 'flex';
            document.querySelector('.header').style.display = 'none';
            document.querySelector('.grid-stack').style.display = 'none';
            // Load OAuth providers
            loadOAuthProviders();
        }

        // OAuth/SSO functions
        async function loadOAuthProviders() {
            const oauthButtons = document.getElementById('oauth-buttons');
            const oauthLoading = document.getElementById('oauth-loading');
            const loginDivider = document.getElementById('login-divider');

            oauthLoading.classList.add('show');

            try {
                const resp = await fetch('/api/auth/providers');
                if (resp.ok) {
                    const data = await resp.json();
                    const providers = data.providers || [];
                    const oauthProviders = providers.filter(p => p.type === 'oauth2');

                    if (oauthProviders.length > 0) {
                        // Show/hide buttons based on available providers
                        document.querySelector('.oauth-btn.google').style.display =
                            oauthProviders.some(p => p.id === 'google') ? 'flex' : 'none';
                        document.querySelector('.oauth-btn.github').style.display =
                            oauthProviders.some(p => p.id === 'github') ? 'flex' : 'none';
                        document.querySelector('.oauth-btn.microsoft').style.display =
                            oauthProviders.some(p => p.id === 'microsoft') ? 'flex' : 'none';

                        oauthButtons.style.display = 'flex';
                        loginDivider.style.display = 'flex';
                    }
                }
            } catch (e) {
                console.log('No OAuth providers available');
            }

            oauthLoading.classList.remove('show');
        }

        function startOAuth(provider) {
            // Redirect to OAuth start endpoint
            window.location.href = '/api/auth/oauth/' + provider;
        }

        // Check for OAuth callback success (token in URL or cookie)
        function checkOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');

            if (error) {
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = 'OAuth failed: ' + (urlParams.get('error_description') || error);
                errorEl.classList.add('show');
                // Clear URL params
                window.history.replaceState({}, document.title, window.location.pathname);
                return false;
            }

            return false;
        }

        // Token refresh functionality
        async function refreshAccessToken() {
            try {
                const resp = await fetch('/api/auth/token/refresh', {
                    method: 'POST',
                    credentials: 'include'
                });

                if (resp.ok) {
                    const data = await resp.json();
                    // Token refreshed via cookie
                    return true;
                }
            } catch (e) {
                console.log('Token refresh failed');
            }
            return false;
        }

        // Set up token refresh interval (every 10 minutes)
        setInterval(async () => {
            if (currentUser) {
                await refreshAccessToken();
            }
        }, 10 * 60 * 1000);

        function showAuthenticatedUI() {
            document.getElementById('login-screen').style.display = 'none';
            document.querySelector('.header').style.display = 'flex';
            document.querySelector('.grid-stack').style.display = 'block';
            document.getElementById('user-menu').style.display = 'block';

            // Update user info in header
            if (currentUser) {
                const initials = (currentUser.name || currentUser.email || '?').substring(0, 2).toUpperCase();
                document.getElementById('user-avatar').textContent = initials;
                document.getElementById('user-name-display').textContent = currentUser.name || currentUser.email;
                document.getElementById('user-full-name').textContent = currentUser.name || 'User';
                document.getElementById('user-email').textContent = currentUser.email || '';
                document.getElementById('user-role-badge').textContent = currentUser.role || 'viewer';
                document.getElementById('user-role-badge').className = 'user-menu-role ' + (currentUser.role || '');

                // Show admin menu items
                if (currentUser.role === 'owner' || currentUser.role === 'admin') {
                    document.getElementById('users-menu-item').style.display = 'flex';
                    document.getElementById('teams-menu-item').style.display = 'flex';
                }
            }
        }

        function toggleUserMenu() {
            const dropdown = document.getElementById('user-menu-dropdown');
            dropdown.classList.toggle('show');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            const userMenu = document.getElementById('user-menu');
            if (userMenu && !userMenu.contains(e.target)) {
                document.getElementById('user-menu-dropdown')?.classList.remove('show');
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.classList.remove('show');

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (resp.ok) {
                    const data = await resp.json();
                    currentUser = data.user;
                    showAuthenticatedUI();
                    // Re-initialize the dashboard
                    loadLayout();
                    loadDashboards();
                    setTimeout(initCharts, 100);
                } else {
                    errorEl.textContent = 'Invalid email or password';
                    errorEl.classList.add('show');
                }
            } catch (e) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('show');
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {}
            currentUser = null;
            currentOrg = null;
            showLoginScreen();
        }

        function showUserSettings() {
            document.getElementById('user-menu-dropdown').classList.remove('show');
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-header">
                        <span class="modal-title">User Settings</span>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">Name</label>
                            <input type="text" id="settings-name" class="form-input" value="${escapeHtml(currentUser?.name || '')}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="settings-email" class="form-input" value="${escapeHtml(currentUser?.email || '')}" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Timezone</label>
                            <select id="settings-timezone" class="form-select">
                                <option value="">Auto-detect</option>
                                <option value="UTC">UTC</option>
                                <option value="America/New_York">Eastern Time</option>
                                <option value="America/Chicago">Central Time</option>
                                <option value="America/Denver">Mountain Time</option>
                                <option value="America/Los_Angeles">Pacific Time</option>
                                <option value="Europe/London">London</option>
                                <option value="Europe/Paris">Paris</option>
                                <option value="Asia/Tokyo">Tokyo</option>
                            </select>
                        </div>
                        <hr style="border-color: #2f3336; margin: 1rem 0;">
                        <h4 style="font-size: 0.85rem; margin-bottom: 0.8rem;">Change Password</h4>
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" id="settings-old-password" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" id="settings-new-password" class="form-input">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                        <button class="btn btn-primary" onclick="saveUserSettings()">Save Changes</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            // Set current timezone
            if (currentUser?.timezone) {
                document.getElementById('settings-timezone').value = currentUser.timezone;
            }
        }

        async function saveUserSettings() {
            const name = document.getElementById('settings-name').value;
            const timezone = document.getElementById('settings-timezone').value;
            const oldPassword = document.getElementById('settings-old-password').value;
            const newPassword = document.getElementById('settings-new-password').value;

            try {
                // Update user info
                const resp = await fetch(`/api/users/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, timezone })
                });
                if (resp.ok) {
                    const updatedUser = await resp.json();
                    currentUser = updatedUser;
                    showAuthenticatedUI();
                }

                // Change password if provided
                if (oldPassword && newPassword) {
                    const pwResp = await fetch('/api/auth/password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
                    });
                    if (!pwResp.ok) {
                        alert('Failed to change password. Check your current password.');
                        return;
                    }
                }

                document.querySelector('.modal-overlay')?.remove();
            } catch (e) {
                alert('Failed to save settings');
            }
        }

        // =====================================
        // User Management (Admin)
        // =====================================
        async function showUserManagement() {
            document.getElementById('user-menu-dropdown').classList.remove('show');
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="modal" style="max-width: 600px;">
                    <div class="modal-header">
                        <span class="modal-title">User Management</span>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="modal-body" style="padding: 0;">
                        <div style="padding: 0.8rem; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #71767b; font-size: 0.8rem;" id="users-org-name">${escapeHtml(currentOrg?.name || 'Organization')}</span>
                            <button class="btn btn-primary" onclick="showInviteUserModal()">+ Invite User</button>
                        </div>
                        <div class="users-list" id="users-list">
                            <div class="empty-state">Loading users...</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="showPendingInvites()">Pending Invites</button>
                        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            loadUsersList();
        }

        async function loadUsersList() {
            try {
                const resp = await fetch('/api/users');
                const users = await resp.json();
                const list = document.getElementById('users-list');
                if (!users?.length) {
                    list.innerHTML = '<div class="empty-state">No users found</div>';
                    return;
                }
                list.innerHTML = users.map(u => `
                    <div class="user-item ${u.is_active ? '' : 'user-inactive'}">
                        <div class="user-item-avatar">${(u.name || u.email).substring(0, 2).toUpperCase()}</div>
                        <div class="user-item-info">
                            <div class="user-item-name">
                                ${escapeHtml(u.name || 'Unnamed')}
                                ${u.id === currentUser?.id ? '<span style="color: #1d9bf0; font-size: 0.7rem;">(you)</span>' : ''}
                                ${!u.is_active ? '<span style="color: #f4212e; font-size: 0.7rem;">(inactive)</span>' : ''}
                            </div>
                            <div class="user-item-email">${escapeHtml(u.email)}</div>
                        </div>
                        <span class="user-item-role ${u.role}">${u.role}</span>
                        <div class="user-item-actions">
                            ${u.id !== currentUser?.id ? `
                                <button class="btn" onclick="editUser('${u.id}')" style="padding: 0.2rem 0.4rem; font-size: 0.65rem;">Edit</button>
                                <button class="btn" onclick="toggleUserActive('${u.id}', ${u.is_active})" style="padding: 0.2rem 0.4rem; font-size: 0.65rem;">${u.is_active ? 'Disable' : 'Enable'}</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('users-list').innerHTML = '<div class="empty-state">Failed to load users</div>';
            }
        }

        function showInviteUserModal() {
            const inviteModal = document.createElement('div');
            inviteModal.className = 'modal-overlay';
            inviteModal.style.zIndex = '1001';
            inviteModal.onclick = (e) => { if (e.target === inviteModal) inviteModal.remove(); };
            inviteModal.innerHTML = `
                <div class="modal" style="max-width: 400px;">
                    <div class="modal-header">
                        <span class="modal-title">Invite User</span>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="invite-email" class="form-input" placeholder="user@example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Role</label>
                            <select id="invite-role" class="form-select">
                                <option value="viewer">Viewer</option>
                                <option value="editor">Editor</option>
                                ${currentUser?.role === 'owner' ? '<option value="admin">Admin</option>' : ''}
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                        <button class="btn btn-primary" onclick="sendInvite()">Send Invite</button>
                    </div>
                </div>
            `;
            document.body.appendChild(inviteModal);
        }

        async function sendInvite() {
            const email = document.getElementById('invite-email').value;
            const role = document.getElementById('invite-role').value;
            if (!email) { alert('Email is required'); return; }

            try {
                const resp = await fetch('/api/auth/invites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, role })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    // Show the invite token (in a real app, this would be sent via email)
                    alert('Invitation created! Token: ' + data.token + '\\n\\nShare this with the user to accept the invite.');
                    document.querySelector('.modal-overlay[style*="z-index: 1001"]')?.remove();
                    loadUsersList();
                } else {
                    alert('Failed to create invitation');
                }
            } catch (e) {
                alert('Failed to create invitation');
            }
        }

        async function showPendingInvites() {
            try {
                const resp = await fetch('/api/auth/invites');
                const invites = await resp.json();

                const inviteModal = document.createElement('div');
                inviteModal.className = 'modal-overlay';
                inviteModal.style.zIndex = '1001';
                inviteModal.onclick = (e) => { if (e.target === inviteModal) inviteModal.remove(); };
                inviteModal.innerHTML = `
                    <div class="modal" style="max-width: 500px;">
                        <div class="modal-header">
                            <span class="modal-title">Pending Invitations</span>
                            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                        </div>
                        <div class="modal-body" style="max-height: 300px; overflow-y: auto;">
                            ${!invites?.length ? '<div class="empty-state">No pending invitations</div>' : invites.map(inv => `
                                <div style="padding: 0.6rem 0; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-weight: 500;">${escapeHtml(inv.email)}</div>
                                        <div style="font-size: 0.7rem; color: #71767b;">Role: ${inv.role} | Expires: ${new Date(inv.expires_at).toLocaleDateString()}</div>
                                    </div>
                                    <button class="btn" style="background: #4a1919; color: #f4212e; padding: 0.2rem 0.4rem; font-size: 0.65rem;" onclick="deleteInvite('${inv.id}')">Revoke</button>
                                </div>
                            `).join('')}
                        </div>
                        <div class="modal-footer">
                            <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(inviteModal);
            } catch (e) {
                alert('Failed to load invitations');
            }
        }

        async function deleteInvite(id) {
            try {
                await fetch(`/api/auth/invites/${id}`, { method: 'DELETE' });
                document.querySelector('.modal-overlay[style*="z-index: 1001"]')?.remove();
                showPendingInvites();
            } catch (e) {}
        }

        async function editUser(userId) {
            try {
                const resp = await fetch(`/api/users/${userId}`);
                const user = await resp.json();

                const editModal = document.createElement('div');
                editModal.className = 'modal-overlay';
                editModal.style.zIndex = '1001';
                editModal.onclick = (e) => { if (e.target === editModal) editModal.remove(); };
                editModal.innerHTML = `
                    <div class="modal" style="max-width: 400px;">
                        <div class="modal-header">
                            <span class="modal-title">Edit User</span>
                            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label">Name</label>
                                <input type="text" id="edit-user-name" class="form-input" value="${escapeHtml(user.name || '')}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Role</label>
                                <select id="edit-user-role" class="form-select">
                                    <option value="viewer" ${user.role === 'viewer' ? 'selected' : ''}>Viewer</option>
                                    <option value="editor" ${user.role === 'editor' ? 'selected' : ''}>Editor</option>
                                    ${currentUser?.role === 'owner' ? `<option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>` : ''}
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn" style="background: #4a1919; color: #f4212e;" onclick="deleteUser('${userId}')">Delete User</button>
                            <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="btn btn-primary" onclick="saveUserEdit('${userId}')">Save</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(editModal);
            } catch (e) {
                alert('Failed to load user');
            }
        }

        async function saveUserEdit(userId) {
            const name = document.getElementById('edit-user-name').value;
            const role = document.getElementById('edit-user-role').value;

            try {
                await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, role })
                });
                document.querySelector('.modal-overlay[style*="z-index: 1001"]')?.remove();
                loadUsersList();
            } catch (e) {
                alert('Failed to update user');
            }
        }

        async function createAPIKey() {
            const name = document.getElementById('apikey-name').value;
            const expiresIn = document.getElementById('apikey-expires').value;
            if (!name) { alert('Name is required'); return; }

            const allAccess = document.getElementById('perm-all').checked;
            const permissions = [];
            if (allAccess) {
                permissions.push({ resource: '*', action: '*' });
            } else {
                document.querySelectorAll('.perm-check:checked').forEach(cb => {
                    permissions.push({ resource: cb.value, action: '*' });
                });
            }

            if (!permissions.length) {
                alert('Select at least one permission');
                return;
            }

            try {
                const resp = await fetch('/api/apikeys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, permissions, expires_in: expiresIn })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    // Show the created key (only shown once!)
                    document.querySelector('.modal-overlay[style*="z-index: 1001"]')?.remove();
                    showCreatedAPIKey(data);
                } else {
                    alert('Failed to create API key');
                }
            } catch (e) {
                alert('Failed to create API key');
            }
        }

        function getChannelConfig() {
            const type = document.getElementById('channel-type').value;
            const config = {};

            const getVal = (id) => document.getElementById(id)?.value || '';
            const getChecked = (id) => document.getElementById(id)?.checked || false;

            switch (type) {
                case 'webhook':
                    config.url = getVal('config-url');
                    config.method = getVal('config-method');
                    break;
                case 'slack':
                    config.webhook_url = getVal('config-webhook_url');
                    if (getVal('config-channel')) config.channel = getVal('config-channel');
                    break;
                case 'email':
                    config.smtp_host = getVal('config-smtp_host');
                    config.smtp_port = parseInt(getVal('config-smtp_port')) || 587;
                    config.username = getVal('config-username');
                    config.password = getVal('config-password');
                    config.from = getVal('config-from');
                    config.to = getVal('config-to').split(',').map(s => s.trim()).filter(s => s);
                    config.tls = getChecked('config-tls');
                    break;
                case 'pagerduty':
                    config.integration_key = getVal('config-integration_key');
                    if (getVal('config-default_severity')) config.default_severity = getVal('config-default_severity');
                    break;
                case 'opsgenie':
                    config.api_key = getVal('config-api_key');
                    config.region = getVal('config-region');
                    if (getVal('config-priority')) config.priority = getVal('config-priority');
                    break;
                case 'msteams':
                    config.webhook_url = getVal('config-webhook_url');
                    break;
                case 'discord':
                    config.webhook_url = getVal('config-webhook_url');
                    if (getVal('config-username')) config.username = getVal('config-username');
                    break;
            }
            return config;
        }

        async function createNotifyChannel() {
            const name = document.getElementById('channel-name').value;
            const type = document.getElementById('channel-type').value;
            const enabled = document.getElementById('channel-enabled').checked;
            const config = getChannelConfig();

            if (!name) { alert('Name is required'); return; }

            try {
                const resp = await fetch('/api/notify/channels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, type, config, enabled })
                });
                if (resp.ok) {
                    document.querySelector('.modal-overlay[style*="z-index: 1001"]')?.remove();
                    loadNotifyChannelsList();
                } else {
                    const err = await resp.json();
                    alert('Failed to create channel: ' + (err.error || 'Unknown error'));
                }
            } catch (e) {
                alert('Failed to create channel');
            }
        }

            const saved = localStorage.getItem('dogwatch-layout');

            const defaultsById = {};
            defaultLayout.forEach(d => defaultsById[d.id] = d);

        async function loadDashboards() {
            try {
                const resp = await fetch('/api/dashboards');
                dashboards = await resp.json() || [];
                const select = document.getElementById('dashboard-select');
                select.innerHTML = '<option value="">Default Layout</option>';
                dashboards.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name + (d.is_default ? ' *' : '');
                    select.appendChild(opt);
                });
                // Load default dashboard if exists
                const defaultDash = dashboards.find(d => d.is_default);
                if (defaultDash && !localStorage.getItem('dogwatch-layout')) {
                    currentDashboardId = defaultDash.id;
                    select.value = defaultDash.id;
                    applyDashboardLayout(defaultDash.layout);
                }
            } catch (e) { console.error('Failed to load dashboards:', e); }
        }

        function applyDashboardLayout(layout) {
            if (!layout || !layout.length) return;
            grid.removeAll();
            layout.forEach(pos => {
                const widgetDef = defaultLayout.find(w => w.id === pos.id);
                if (widgetDef) {
                    const content = getWidgetContent(pos.id);
                    grid.addWidget({
                        id: pos.id,
                        x: pos.x, y: pos.y, w: pos.w, h: pos.h,
                        minW: widgetDef.minW, minH: widgetDef.minH,
                        content: content
                    });
                }
            });
            setTimeout(initCharts, 100);
        }

        async function loadDashboard(id) {
            if (!id) {
                currentDashboardId = null;
                resetLayout();
                return;
            }
            try {
                const resp = await fetch(`/api/dashboards/${id}`);
                const dash = await resp.json();
                currentDashboardId = id;
                applyDashboardLayout(dash.layout);
            } catch (e) { alert('Failed to load dashboard'); }
        }

        async function saveDashboard() {
            const layout = grid.save(false).map(item => ({
                id: item.id, x: item.x, y: item.y, w: item.w, h: item.h
            }));

            if (currentDashboardId) {
                // Update existing dashboard
                const dash = dashboards.find(d => d.id === currentDashboardId);
                const name = prompt('Dashboard name:', dash?.name || 'My Dashboard');
                if (!name) return;
                try {
                    await fetch(`/api/dashboards/${currentDashboardId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, layout })
                    });
                    loadDashboards();
                } catch (e) { alert('Failed to save dashboard'); }
            } else {
                // Create new dashboard
                const name = prompt('Dashboard name:', 'My Dashboard');
                if (!name) return;
                try {
                    const resp = await fetch('/api/dashboards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, layout, is_default: false })
                    });
                    const dash = await resp.json();
                    currentDashboardId = dash.id;
                    loadDashboards();
                    document.getElementById('dashboard-select').value = dash.id;
                } catch (e) { alert('Failed to create dashboard'); }
            }
        }

            const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return (b / Math.pow(k, i)).toFixed(1) + ' ' + s[i];

            generateHistoryData(durationMs) {
                const now = Date.now();
                const points = 60;
                const interval = durationMs / points;
                const data = [];
                let cpuBase = 25 + Math.random() * 20;
                let memBase = 55 + Math.random() * 15;
                for (let i = 0; i < points; i++) {
                    cpuBase += (Math.random() - 0.5) * 8;
                    memBase += (Math.random() - 0.5) * 3;
                    cpuBase = Math.max(5, Math.min(95, cpuBase));
                    memBase = Math.max(40, Math.min(90, memBase));
                    data.push({
                        timestamp: new Date(now - durationMs + i * interval).toISOString(),
                        cpu_percent: cpuBase,
                        mem_percent: memBase
                    });
                }
                return data;

        // Service map - redesigned
        let svcMapData = { nodes: [], links: [] };

        function toggleSvcMapLayout() {

            renderServiceMap();

        function renderServiceMap() {
            const container = document.getElementById('svcmap-container');
            const svg = d3.select('#service-map');
            const tooltip = document.getElementById('svcmap-tooltip');
            const statsEl = document.getElementById('svcmap-stats');

            if (!container || !svg.node()) return;
            const rect = container.getBoundingClientRect();
            if (rect.width < 50 || rect.height < 50) return;

            const w = rect.width, h = rect.height - 50;
            svg.attr('width', w).attr('height', h);

            // Filter nodes
            let nodes = svcMapData.nodes.map(n => ({...n}));
            if (svcMapFilter) {
                if (svcMapFilter === 'services') nodes = nodes.filter(n => n.type === 'service');
                else if (svcMapFilter === 'external') nodes = nodes.filter(n => n.type === 'external');
                else if (svcMapFilter === 'processes') nodes = nodes.filter(n => n.type === 'process');
            }

            const nodeIds = new Set(nodes.map(n => n.id));
            let links = svcMapData.links.filter(l => nodeIds.has(l.source?.id || l.source) && nodeIds.has(l.target?.id || l.target)).map(l => ({...l}));

            // Calculate aggregate stats
            const totalRequests = links.reduce((sum, l) => sum + (l.count || 0), 0);
            const avgLatency = links.length ? Math.round(links.reduce((sum, l) => sum + (l.latency || 0), 0) / links.length) : 0;
            const totalErrors = links.reduce((sum, l) => sum + (l.errors || 0), 0);
            const errorRate = totalRequests > 0 ? ((totalErrors / totalRequests) * 100).toFixed(1) : 0;

            if (statsEl) {
                statsEl.innerHTML = `<span>${nodes.length} nodes</span><span>·</span><span>${links.length} edges</span>` +
                    (totalRequests > 0 ? `<span>·</span><span>${totalRequests} req</span><span>·</span><span>${avgLatency}ms avg</span>` : '') +
                    (totalErrors > 0 ? `<span>·</span><span style="color:#f4212e">${errorRate}% err</span>` : '');
            }

            if (!nodes.length) {
                svg.selectAll('*').remove();
                svg.append('text').attr('x', w/2).attr('y', h/2).attr('text-anchor', 'middle')
                    .attr('fill', '#71767b').attr('font-size', '14px').text('No service connections yet');
                return;
            }

            svg.selectAll('*').remove();

            // Defs for markers and filters (add before main group)
            const defs = svg.append('defs');

            // Arrow markers with different colors
            ['#536471', '#1d9bf0', '#f4212e', '#00ba7c'].forEach((color, i) => {
                defs.append('marker')
                    .attr('id', `arrow-${i}`).attr('viewBox', '0 -5 10 10')
                    .attr('refX', 32).attr('refY', 0)
                    .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
                    .append('path').attr('d', 'M0,-4L10,0L0,4').attr('fill', color);
            });

            // Glow filter for selected nodes
            const glow = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
            glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
            glow.append('feMerge').html('<feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>');

            // Main group for zoom/pan
            svcMapMainGroup = svg.append('g').attr('class', 'svcmap-main-group');

            // Setup zoom behavior - instant transforms, no transitions
            svcMapZoomBehavior = d3.zoom()
                .scaleExtent([0.2, 4])
                .filter((event) => {
                    // Allow wheel zoom and drag pan, but not on double-click
                    return !event.button && event.type !== 'dblclick';
                })
                .on('zoom', (event) => {
                    svcMapTransform = event.transform;
                    svcMapMainGroup.attr('transform', event.transform);
                });

            svg.call(svcMapZoomBehavior)
               .call(svcMapZoomBehavior.transform, svcMapTransform); // Apply saved transform

            // Layout nodes with more spacing
            const nodeSpacing = 120; // Minimum spacing between nodes
            const padding = 80;

            if (svcMapLayout === 'radial') {
                const centerX = w / 2, centerY = h / 2;
                // Much larger radius for better spacing
                const baseRadius = Math.max(150, Math.min(w, h) * 0.4);
                const radius = Math.max(baseRadius, nodes.length * 25);
                nodes.forEach((n, i) => {
                    const angle = (i / nodes.length) * 2 * Math.PI - Math.PI / 2;
                    n.x = centerX + radius * Math.cos(angle);
                    n.y = centerY + radius * Math.sin(angle);
                });
            } else {
                // Hierarchical layout with more generous spacing
                const layers = { 0: [], 1: [], 2: [] };
                nodes.forEach(n => {
                    const layer = n.type === 'process' ? 0 : n.type === 'service' ? 1 : 2;
                    layers[layer].push(n);
                });
                const usedLayers = Object.entries(layers).filter(([, arr]) => arr.length > 0);
                const layerGap = Math.max(150, h / (usedLayers.length + 1));

                usedLayers.forEach(([, layerNodes], layerIdx) => {
                    const y = padding + (layerIdx + 0.5) * layerGap;
                    // Calculate width needed for this layer
                    const layerWidth = Math.max(w, layerNodes.length * nodeSpacing + padding * 2);
                    const startX = (layerWidth - (layerNodes.length - 1) * nodeSpacing) / 2;
                    layerNodes.forEach((n, i) => {
                        n.x = startX + i * nodeSpacing;
                        n.y = y;
                    });
                });
            }

            // Draw edges first (under nodes)
            const linkGroup = svcMapMainGroup.append('g').attr('class', 'svcmap-links');
            links.forEach(l => {
                const source = nodes.find(n => n.id === (l.source?.id || l.source));
                const target = nodes.find(n => n.id === (l.target?.id || l.target));
                if (!source || !target) return;

                const hasErrors = l.errors > 0;
                const isActive = l.count > 0;
                const errorRate = l.count > 0 ? (l.errors || 0) / l.count : 0;

                // Curved path with bezier
                const dx = target.x - source.x;
                const dy = target.y - source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const curve = Math.min(40, dist * 0.15);

                // Perpendicular offset for curve
                const mx = (source.x + target.x) / 2;
                const my = (source.y + target.y) / 2;
                const perpX = -dy / dist * curve;
                const perpY = dx / dist * curve;

                const pathData = `M${source.x},${source.y} Q${mx + perpX},${my + perpY} ${target.x},${target.y}`;

                // Determine edge style
                let edgeClass = 'svcmap-edge';
                let markerIdx = 0;
                if (hasErrors && errorRate > 0.1) {
                    edgeClass += ' svcmap-edge-error';
                    markerIdx = 2;
                } else if (isActive) {
                    edgeClass += ' svcmap-edge-active';
                    markerIdx = 1;
                }

                const edgeG = linkGroup.append('g');

                // Draw edge
                edgeG.append('path')
                    .attr('d', pathData)
                    .attr('class', edgeClass)
                    .attr('marker-end', `url(#arrow-${markerIdx})`);

                // Edge metrics badge (shown on hover or always for important edges)
                if (l.count || l.latency) {
                    const badgeX = mx + perpX * 0.5;
                    const badgeY = my + perpY * 0.5;

                    const badge = edgeG.append('g')
                        .attr('class', 'svcmap-edge-badge')
                        .attr('transform', `translate(${badgeX},${badgeY})`);

                    // Badge background
                    badge.append('rect')
                        .attr('x', -30).attr('y', -10)
                        .attr('width', 60).attr('height', 20)
                        .attr('rx', 4)
                        .attr('fill', hasErrors ? 'rgba(74,25,25,0.95)' : 'rgba(47,51,54,0.95)')
                        .attr('stroke', hasErrors ? '#f4212e' : '#3f4346');

                    // Metrics text
                    let metricsText = '';
                    if (l.count) metricsText += `${l.count}`;
                    if (l.latency) metricsText += ` · ${l.latency}ms`;
                    if (l.errors && errorRate > 0) metricsText = `${(errorRate * 100).toFixed(0)}% err`;

                    badge.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('dy', 4)
                        .attr('fill', hasErrors ? '#f4212e' : '#e7e9ea')
                        .attr('font-size', '9px')
                        .attr('font-weight', '500')
                        .text(metricsText);
                }
            });

            // Draw nodes
            const nodeGroup = svcMapMainGroup.append('g').attr('class', 'svcmap-nodes');
            nodes.forEach(n => {
                const g = nodeGroup.append('g')
                    .attr('class', 'svcmap-node')
                    .attr('transform', `translate(${n.x},${n.y})`)
                    .attr('data-node-id', n.id)
                    .style('cursor', 'pointer');

                // Determine health status
                const hasErrors = n.errors > 0;
                const isDegraded = n.latency > 500;
                const isExternal = n.type === 'external';
                const isProcess = n.type === 'process';

                let nodeColor = '#00ba7c'; // healthy
                if (hasErrors) nodeColor = '#f4212e';
                else if (isDegraded) nodeColor = '#ffd400';
                else if (isExternal) nodeColor = '#536471';
                else if (isProcess) nodeColor = '#7c3aed';

                // Outer ring (health indicator)
                g.append('circle')
                    .attr('r', 24)
                    .attr('fill', 'none')
                    .attr('stroke', nodeColor)
                    .attr('stroke-width', 2)
                    .attr('opacity', 0.5);

                // Inner circle
                g.append('circle')
                    .attr('r', 18)
                    .attr('fill', '#1a1f2e')
                    .attr('stroke', nodeColor)
                    .attr('stroke-width', 2);

                // Icon (using simple text icons)
                const icons = {
                    'external': '⬡',
                    'process': '◎',
                    'service': '◆',
                    'database': '▣',
                    'cache': '◈',
                    'queue': '▤'
                };
                g.append('text')
                    .attr('text-anchor', 'middle')
                    .attr('dy', 5)
                    .attr('fill', nodeColor)
                    .attr('font-size', '14px')
                    .text(icons[n.type] || icons.service);

                // Label
                const displayName = n.name.length > 18 ? n.name.slice(0, 16) + '..' : n.name;
                g.append('text')
                    .attr('class', 'svcmap-node-label')
                    .attr('text-anchor', 'middle')
                    .attr('y', 36)
                    .attr('fill', '#e7e9ea')
                    .attr('font-size', '11px')
                    .attr('font-weight', '500')
                    .text(displayName);

                // Metrics sublabel
                if (n.count || n.latency) {
                    const metrics = [];
                    if (n.count) metrics.push(`${n.count} req`);
                    if (n.latency) metrics.push(`${n.latency}ms`);
                    g.append('text')
                        .attr('class', 'svcmap-node-sublabel')
                        .attr('text-anchor', 'middle')
                        .attr('y', 48)
                        .attr('fill', '#71767b')
                        .attr('font-size', '9px')
                        .text(metrics.join(' · '));
                }

                // Error indicator badge
                if (hasErrors) {
                    g.append('circle')
                        .attr('cx', 14).attr('cy', -14)
                        .attr('r', 8)
                        .attr('fill', '#f4212e');
                    g.append('text')
                        .attr('x', 14).attr('y', -11)
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#fff')
                        .attr('font-size', '9px')
                        .attr('font-weight', 'bold')
                        .text(n.errors > 99 ? '99+' : n.errors);
                }

                // Hover effects
                g.on('mouseenter', function(event) {
                    d3.select(this).select('circle:nth-child(2)').attr('filter', 'url(#glow)');

                    tooltip.innerHTML = `
                        <div class="svcmap-tooltip-title">${escapeHtml(n.name)}</div>
                        <div class="svcmap-tooltip-row"><span>Type</span><span class="svcmap-tooltip-value">${n.type}</span></div>
                        <div class="svcmap-tooltip-row"><span>Requests</span><span class="svcmap-tooltip-value">${n.count || 0}</span></div>
                        ${n.latency ? `<div class="svcmap-tooltip-row"><span>Avg Latency</span><span class="svcmap-tooltip-value">${n.latency}ms</span></div>` : ''}
                        ${n.errors ? `<div class="svcmap-tooltip-row"><span>Errors</span><span class="svcmap-tooltip-value" style="color:#f4212e">${n.errors}</span></div>` : ''}
                    `;
                    tooltip.style.display = 'block';

                    const svgRect = svg.node().getBoundingClientRect();
                    tooltip.style.left = Math.min(event.clientX - svgRect.left + 15, w - 180) + 'px';
                    tooltip.style.top = Math.min(event.clientY - svgRect.top + 15, h - 100) + 'px';
                })
                .on('mouseleave', function() {
                    d3.select(this).select('circle:nth-child(2)').attr('filter', null);
                    tooltip.style.display = 'none';
                })
                .on('click', function() {
                    openSvcMapDetail(n);
                });
            });
        }

        // Node detail panel
        function openSvcMapDetail(node) {
            svcMapSelectedNode = node;
            const detail = document.getElementById('svcmap-detail');
            const title = document.getElementById('svcmap-detail-title');
            const body = document.getElementById('svcmap-detail-body');

            if (!detail) return;

            title.textContent = node.name;

            // Find connected nodes
            const inbound = svcMapData.links.filter(l => (l.target?.id || l.target) === node.id);
            const outbound = svcMapData.links.filter(l => (l.source?.id || l.source) === node.id);

            const inboundTotal = inbound.reduce((sum, l) => sum + (l.count || 0), 0);

                        ${inbound.slice(0, 5).map(l => {

                            return `<li><span>${escapeHtml(srcNode?.name || 'unknown')}</span><span>${l.count || 0} req</span></li>`;

                    </ul>
                </div>` : ''}
                ${outbound.length > 0 ? `
                <div class="svcmap-detail-section">
                    <div class="svcmap-detail-section-title">Outbound (${outbound.length})</div>
                    <ul class="svcmap-detail-list">

                            const tgtNode = svcMapData.nodes.find(n => n.id === (l.target?.id || l.target));
                            return `<li><span>${escapeHtml(tgtNode?.name || 'unknown')}</span><span>${l.count || 0} req</span></li>`;

                        ${outbound.length > 5 ? `<li style="color:#71767b"><span>+${outbound.length - 5} more</span></li>` : ''}

        function viewServiceTraces() {
