<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dogwatch - eBPF Observability</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon { font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 600; }
        .logo span { color: #71767b; font-size: 0.7rem; margin-left: 0.5rem; }
        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .status { display: flex; align-items: center; gap: 0.5rem; color: #71767b; font-size: 0.8rem; }
        .status-dot { width: 8px; height: 8px; background: #00ba7c; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 5px; cursor: pointer; font-size: 0.75rem; background: #2f3336; color: #e7e9ea; }
        .btn:hover { background: #3f4346; }
        .btn-primary { background: #1d9bf0; }
        .btn-primary:hover { background: #1a8cd8; }

        /* GridStack customization */
        .grid-stack { background: #0f1419; min-height: calc(100vh - 60px); padding: 6px; }
        .grid-stack-item { padding: 0; }
        .grid-stack-item-content {
            inset: 0;
            position: absolute;
            display: flex;
            flex-direction: column;
        }
        .gs-item-content {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .widget-header {
            padding: 0.6rem 0.8rem;
            background: #1a1f2e;
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
            min-height: 36px;
        }
        .widget-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #71767b; font-weight: 600; }
        .widget-body { padding: 0.8rem; flex: 1; overflow: auto; position: relative; min-height: 0; }
        .widget-body.no-pad { padding: 0; }

        /* Metric widgets */
        .metric-big { font-size: 2rem; font-weight: 700; }
        .metric-bar { height: 6px; background: #2f3336; border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
        .metric-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .metric-bar-fill.cpu { background: linear-gradient(90deg, #1d9bf0, #1d4ed8); }
        .metric-bar-fill.mem { background: linear-gradient(90deg, #00ba7c, #059669); }
        .metric-bar-fill.disk { background: linear-gradient(90deg, #f4212e, #dc2626); }
        .metric-bar-fill.net { background: linear-gradient(90deg, #7c3aed, #6d28d9); }
        .metric-detail { font-size: 0.7rem; color: #71767b; margin-top: 0.4rem; display: flex; justify-content: space-between; }

        /* Stats */
        .stat-big { font-size: 1.8rem; font-weight: 700; }
        .stat-big.error { color: #f4212e; }

        /* Service map */
        .node-process { fill: #1d9bf0; }
        .node-external { fill: #f4212e; }
        .node-service { fill: #00ba7c; }
        .node-label { fill: #e7e9ea; font-size: 10px; }
        .link { stroke: #2f3336; stroke-opacity: 0.8; }
        .link.trace-link { stroke: #00ba7c; stroke-opacity: 0.6; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th { text-align: left; padding: 0.5rem; color: #71767b; font-weight: 500; font-size: 0.65rem; text-transform: uppercase; border-bottom: 1px solid #2f3336; }
        td { padding: 0.5rem; border-bottom: 1px solid #2f3336; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #1d1f23; }
        .method { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: 600; font-size: 0.6rem; }
        .method.GET { background: #1d4ed8; color: #93c5fd; }
        .method.POST { background: #059669; color: #6ee7b7; }
        .method.PUT { background: #d97706; color: #fcd34d; }
        .method.DELETE { background: #dc2626; color: #fca5a5; }
        .path { font-family: monospace; color: #1d9bf0; font-size: 0.7rem; }
        .latency { font-family: monospace; }
        .latency.good { color: #00ba7c; }
        .latency.warn { color: #ffd400; }
        .latency.bad { color: #f4212e; }
        .empty-state { padding: 1.5rem; text-align: center; color: #71767b; font-size: 0.8rem; }

        /* Flame graph */
        #flamegraph .d3-flame-graph rect { stroke: #0f1419; }
        #flamegraph .d3-flame-graph-label { fill: #e7e9ea !important; font-size: 10px; }

        /* Chart container */
        .chart-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

        /* Time selector */
        .time-btns { display: flex; gap: 0.3rem; }
        .time-btn { padding: 0.2rem 0.5rem; background: #2f3336; border: none; border-radius: 3px; color: #71767b; cursor: pointer; font-size: 0.65rem; }
        .time-btn:hover { background: #3f4346; color: #e7e9ea; }
        .time-btn.active { background: #1d9bf0; color: white; }

        /* GridStack handles */
        .gs-item > .ui-resizable-handle { background: transparent; }
        .gs-item:hover > .ui-resizable-se { opacity: 1; }
        .ui-resizable-se { opacity: 0; transition: opacity 0.2s; width: 15px; height: 15px; right: 3px; bottom: 3px; background: #1d9bf0; border-radius: 3px; }

        /* Trace visualization */
        .trace-controls { display: flex; gap: 0.5rem; align-items: center; }
        .trace-select { background: #2f3336; border: 1px solid #3f4346; border-radius: 4px; color: #e7e9ea; padding: 0.2rem 0.5rem; font-size: 0.7rem; }
        .trace-list { max-height: 200px; overflow-y: auto; border-bottom: 1px solid #2f3336; }
        .trace-item { padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .trace-item:hover { background: #1d1f23; }
        .trace-item.selected { background: #1d4ed8; }
        .trace-item:last-child { border-bottom: none; }
        .trace-name { font-weight: 500; font-size: 0.75rem; }
        .trace-service { color: #71767b; font-size: 0.65rem; }
        .trace-meta { text-align: right; }
        .trace-duration { font-family: monospace; font-size: 0.7rem; }
        .trace-time { color: #71767b; font-size: 0.6rem; }
        .trace-status { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 0.4rem; }
        .trace-status.ok { background: #00ba7c; }
        .trace-status.error { background: #f4212e; }
        .trace-status.unset { background: #71767b; }

        /* Waterfall view */
        .waterfall { padding: 0.5rem 0.8rem; overflow-x: auto; }
        .waterfall-header { display: flex; justify-content: space-between; font-size: 0.65rem; color: #71767b; margin-bottom: 0.5rem; padding: 0 0.5rem; }
        .span-row { display: flex; align-items: center; padding: 0.25rem 0; border-bottom: 1px solid #1d1f23; min-height: 28px; }
        .span-row:hover { background: #1d1f23; }
        .span-info { width: 180px; flex-shrink: 0; padding-right: 0.5rem; overflow: hidden; }
        .span-name { font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .span-service { font-size: 0.6rem; color: #71767b; }
        .span-timeline { flex: 1; position: relative; height: 18px; }
        .span-bar { position: absolute; height: 14px; top: 2px; border-radius: 2px; min-width: 3px; }
        .span-bar.server { background: linear-gradient(90deg, #1d9bf0, #3b82f6); }
        .span-bar.client { background: linear-gradient(90deg, #7c3aed, #8b5cf6); }
        .span-bar.internal { background: linear-gradient(90deg, #00ba7c, #10b981); }
        .span-bar.error { background: linear-gradient(90deg, #f4212e, #ef4444); }
        .span-duration { position: absolute; right: 0; top: 0; font-size: 0.6rem; font-family: monospace; color: #71767b; }
        .timeline-grid { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; pointer-events: none; }
        .timeline-grid-line { flex: 1; border-left: 1px dashed #2f3336; }
        .no-trace-selected { padding: 2rem; text-align: center; color: #71767b; font-size: 0.8rem; }

        /* Watches */
        .watch-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
        .watch-item:hover { background: #1d1f23; }
        .watch-item:last-child { border-bottom: none; }
        .watch-info { flex: 1; }
        .watch-name { font-weight: 500; font-size: 0.8rem; }
        .watch-condition { color: #71767b; font-size: 0.65rem; font-family: monospace; }
        .watch-state { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .watch-state.ok { background: #0d4429; color: #00ba7c; }
        .watch-state.alerting { background: #4a1919; color: #f4212e; animation: pulse-alert 1s infinite; }
        .watch-state.pending { background: #4a3d19; color: #ffd400; }
        .watch-state.no_data { background: #2f3336; color: #71767b; }
        .watch-state.muted { background: #2f3336; color: #71767b; }
        @keyframes pulse-alert { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .watch-value { font-family: monospace; font-size: 0.7rem; color: #71767b; margin-right: 0.5rem; }
        .watch-actions { display: flex; gap: 0.3rem; }
        .watch-actions button { padding: 0.2rem 0.4rem; font-size: 0.6rem; }

        /* Logs */
        .log-controls { display: flex; gap: 0.5rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; flex-wrap: wrap; }
        .log-controls input, .log-controls select { padding: 0.3rem 0.5rem; background: #2f3336; border: 1px solid #3f4346; border-radius: 4px; color: #e7e9ea; font-size: 0.7rem; }
        .log-controls input { flex: 1; min-width: 150px; }
        .log-controls select { min-width: 80px; }
        .log-entry { padding: 0.4rem 0.8rem; border-bottom: 1px solid #1d1f23; font-family: monospace; font-size: 0.7rem; display: flex; gap: 0.5rem; }
        .log-entry:hover { background: #1d1f23; }
        .log-time { color: #71767b; white-space: nowrap; flex-shrink: 0; }
        .log-level { padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; flex-shrink: 0; }
        .log-level.debug { background: #2f3336; color: #71767b; }
        .log-level.info { background: #1a3a4a; color: #1d9bf0; }
        .log-level.warn { background: #4a3d19; color: #ffd400; }
        .log-level.error { background: #4a1919; color: #f4212e; }
        .log-level.fatal { background: #7a1919; color: #ff6b6b; }
        .log-service { color: #00ba7c; flex-shrink: 0; }
        .log-message { color: #e7e9ea; word-break: break-all; flex: 1; }
        .log-trace-link { color: #7c3aed; cursor: pointer; text-decoration: underline; flex-shrink: 0; }

        /* Synthetics */
        .synth-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
        .synth-item:hover { background: #1d1f23; }
        .synth-item:last-child { border-bottom: none; }
        .synth-info { flex: 1; }
        .synth-name { font-weight: 500; font-size: 0.8rem; }
        .synth-url { color: #71767b; font-size: 0.65rem; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .synth-status { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .synth-status.up { background: #0d4429; color: #00ba7c; }
        .synth-status.down { background: #4a1919; color: #f4212e; }
        .synth-status.degraded { background: #4a3d19; color: #ffd400; }
        .synth-status.unknown { background: #2f3336; color: #71767b; }
        .synth-latency { font-family: monospace; font-size: 0.7rem; color: #71767b; margin-right: 0.5rem; }
        .synth-uptime { font-size: 0.65rem; color: #00ba7c; margin-left: 0.5rem; }
        .synth-actions { display: flex; gap: 0.3rem; }
        .synth-actions button { padding: 0.2rem 0.4rem; font-size: 0.6rem; }

        /* SLOs */
        .slo-item { padding: 0.8rem; border-bottom: 1px solid #2f3336; }
        .slo-item:hover { background: #1d1f23; }
        .slo-item:last-child { border-bottom: none; }
        .slo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .slo-name { font-weight: 500; font-size: 0.85rem; }
        .slo-status { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .slo-status.met { background: #0d4429; color: #00ba7c; }
        .slo-status.at_risk { background: #4a3d19; color: #ffd400; }
        .slo-status.breached { background: #4a1919; color: #f4212e; }
        .slo-status.no_data { background: #2f3336; color: #71767b; }
        .slo-metrics { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
        .slo-metric { text-align: center; }
        .slo-metric-value { font-size: 1.2rem; font-weight: 700; }
        .slo-metric-value.good { color: #00ba7c; }
        .slo-metric-value.warn { color: #ffd400; }
        .slo-metric-value.bad { color: #f4212e; }
        .slo-metric-label { font-size: 0.6rem; color: #71767b; text-transform: uppercase; }
        .slo-budget { margin-top: 0.4rem; }
        .slo-budget-bar { height: 6px; background: #2f3336; border-radius: 3px; overflow: hidden; }
        .slo-budget-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .slo-budget-fill.healthy { background: linear-gradient(90deg, #00ba7c, #059669); }
        .slo-budget-fill.warning { background: linear-gradient(90deg, #ffd400, #f59e0b); }
        .slo-budget-fill.critical { background: linear-gradient(90deg, #f4212e, #dc2626); }
        .slo-budget-text { display: flex; justify-content: space-between; font-size: 0.65rem; color: #71767b; margin-top: 0.2rem; }
        .slo-actions { display: flex; gap: 0.3rem; }
        .slo-actions button { padding: 0.2rem 0.4rem; font-size: 0.6rem; }

        /* Patterns */
        .pattern-stats { display: flex; gap: 1rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; font-size: 0.7rem; }
        .pattern-stat { display: flex; flex-direction: column; }
        .pattern-stat-value { font-size: 1rem; font-weight: 700; color: #e7e9ea; }
        .pattern-stat-label { color: #71767b; font-size: 0.6rem; text-transform: uppercase; }
        .pattern-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; }
        .pattern-item:hover { background: rgba(255,255,255,0.02); }
        .pattern-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
        .pattern-trend { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
        .pattern-trend.increasing { background: #4a1919; color: #f4212e; }
        .pattern-trend.decreasing { background: #0d4429; color: #00ba7c; }
        .pattern-trend.stable { background: #2f3336; color: #71767b; }
        .pattern-trend.new { background: #1d3a5f; color: #1d9bf0; }
        .pattern-count { font-weight: 700; color: #e7e9ea; }
        .pattern-signature { font-family: 'SF Mono', Monaco, monospace; font-size: 0.7rem; color: #8b949e; background: #0d1117; padding: 0.4rem 0.5rem; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pattern-meta { display: flex; gap: 1rem; font-size: 0.65rem; color: #71767b; margin-top: 0.3rem; }
        .pattern-examples { margin-top: 0.4rem; font-size: 0.65rem; }
        .pattern-example { color: #8b949e; background: #0d1117; padding: 0.3rem 0.5rem; border-radius: 3px; margin-top: 0.2rem; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Containers */
        .container-summary { display: flex; gap: 1rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; font-size: 0.7rem; }
        .container-stat { display: flex; flex-direction: column; }
        .container-stat-value { font-size: 1rem; font-weight: 700; color: #e7e9ea; }
        .container-stat-label { color: #71767b; font-size: 0.6rem; text-transform: uppercase; }
        .container-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; }
        .container-item:hover { background: rgba(255,255,255,0.02); }
        .container-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
        .container-state { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
        .container-state.running { background: #0d4429; color: #00ba7c; }
        .container-state.exited { background: #4a1919; color: #f4212e; }
        .container-state.paused { background: #4a3d19; color: #ffd400; }
        .container-state.created { background: #1d3a5f; color: #1d9bf0; }
        .container-name { font-weight: 600; color: #e7e9ea; }
        .container-image { font-size: 0.7rem; color: #71767b; font-family: monospace; }
        .container-metrics { display: flex; gap: 1.5rem; margin-top: 0.4rem; font-size: 0.7rem; }
        .container-metric { display: flex; flex-direction: column; }
        .container-metric-value { font-weight: 600; color: #e7e9ea; }
        .container-metric-label { color: #71767b; font-size: 0.6rem; }
        .container-bar { height: 4px; background: #2f3336; border-radius: 2px; margin-top: 0.2rem; width: 60px; }
        .container-bar-fill { height: 100%; border-radius: 2px; }
        .container-bar-fill.cpu { background: #1d9bf0; }
        .container-bar-fill.mem { background: #00ba7c; }

        /* Deployments */
        .deploy-summary { display: flex; gap: 1rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; font-size: 0.7rem; }
        .deploy-stat { display: flex; flex-direction: column; }
        .deploy-stat-value { font-size: 1rem; font-weight: 700; color: #e7e9ea; }
        .deploy-stat-label { color: #71767b; font-size: 0.6rem; text-transform: uppercase; }
        .deploy-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; display: flex; align-items: center; gap: 0.8rem; }
        .deploy-item:hover { background: rgba(255,255,255,0.02); }
        .deploy-marker { width: 3px; height: 40px; border-radius: 2px; flex-shrink: 0; }
        .deploy-marker.success { background: #00ba7c; }
        .deploy-marker.failed { background: #f4212e; }
        .deploy-marker.rolled_back { background: #ffd400; }
        .deploy-info { flex: 1; min-width: 0; }
        .deploy-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem; }
        .deploy-service { font-weight: 600; color: #e7e9ea; }
        .deploy-version { font-size: 0.7rem; color: #1d9bf0; font-family: monospace; }
        .deploy-env { padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
        .deploy-env.prod { background: #4a1919; color: #f4212e; }
        .deploy-env.staging { background: #4a3d19; color: #ffd400; }
        .deploy-env.dev { background: #1d3a5f; color: #1d9bf0; }
        .deploy-meta { font-size: 0.7rem; color: #71767b; display: flex; gap: 0.8rem; }
        .deploy-time { color: #8b949e; }
        .deploy-user { color: #71767b; }
        .deploy-commit { font-family: monospace; color: #8b949e; }
        .deploy-commit:hover { color: #1d9bf0; text-decoration: underline; }
        .deploy-actions { display: flex; gap: 0.3rem; }

        /* Incidents / Paging */
        .incident-summary { display: flex; gap: 1rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; font-size: 0.7rem; align-items: center; }
        .incident-stat { display: flex; flex-direction: column; }
        .incident-stat-value { font-size: 1rem; font-weight: 700; color: #e7e9ea; }
        .incident-stat-label { color: #71767b; font-size: 0.6rem; text-transform: uppercase; }
        .incident-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }
        .incident-item:hover { background: rgba(255,255,255,0.02); }
        .incident-severity { width: 4px; height: 40px; border-radius: 2px; flex-shrink: 0; }
        .incident-severity.critical { background: #f4212e; animation: pulse-critical 1s infinite; }
        .incident-severity.high { background: #ff6b35; }
        .incident-severity.medium { background: #ffd400; }
        .incident-severity.low { background: #1d9bf0; }
        @keyframes pulse-critical { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .incident-info { flex: 1; min-width: 0; }
        .incident-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem; }
        .incident-title { font-weight: 600; color: #e7e9ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .incident-status { padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
        .incident-status.triggered { background: #4a1919; color: #f4212e; animation: pulse-status 1s infinite; }
        .incident-status.acknowledged { background: #4a3d19; color: #ffd400; }
        .incident-status.resolved { background: #1a3d2e; color: #00ba7c; }
        @keyframes pulse-status { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .incident-meta { font-size: 0.7rem; color: #71767b; display: flex; gap: 0.8rem; }
        /* Cluster/Federation styles */
        .cluster-summary { display: flex; gap: 1rem; padding: 0.5rem 0.8rem; border-bottom: 1px solid #2f3336; font-size: 0.7rem; align-items: center; }
        .cluster-stat { display: flex; flex-direction: column; }
        .cluster-stat-value { font-size: 1rem; font-weight: 700; color: #e7e9ea; }
        .cluster-stat-label { color: #71767b; font-size: 0.6rem; text-transform: uppercase; }
        .cluster-node-item { padding: 0.6rem 0.8rem; border-bottom: 1px solid #2f3336; display: flex; align-items: center; gap: 0.8rem; }
        .cluster-node-item:hover { background: rgba(255,255,255,0.02); }
        .cluster-node-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .cluster-node-status.alive { background: #00ba7c; box-shadow: 0 0 6px #00ba7c; }
        .cluster-node-status.suspect { background: #ffd400; animation: pulse-suspect 1.5s infinite; }
        .cluster-node-status.dead { background: #f4212e; }
        @keyframes pulse-suspect { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .cluster-node-info { flex: 1; min-width: 0; }
        .cluster-node-name { font-weight: 600; color: #e7e9ea; display: flex; align-items: center; gap: 0.4rem; }
        .cluster-node-name .local-badge { font-size: 0.55rem; padding: 0.1rem 0.3rem; background: #1d4ed8; color: #fff; border-radius: 3px; }
        .cluster-node-meta { font-size: 0.7rem; color: #71767b; display: flex; gap: 0.8rem; margin-top: 0.2rem; }
        .cluster-node-metrics { display: flex; gap: 0.6rem; font-size: 0.7rem; color: #888; }
        .cluster-node-metric { display: flex; flex-direction: column; align-items: center; }
        .cluster-node-metric-value { font-weight: 600; color: #e7e9ea; }
        .incident-time { color: #8b949e; }
        .incident-source { color: #71767b; }
        .incident-actions { display: flex; gap: 0.3rem; }
        .oncall-badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.5rem; background: #1a3d2e; border-radius: 4px; font-size: 0.7rem; color: #00ba7c; }
        .oncall-badge::before { content: "\\1F4DE"; font-size: 0.8rem; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #16181c; border: 1px solid #2f3336; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow: auto; }
        .modal-header { padding: 1rem; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1rem; font-weight: 600; }
        .modal-close { background: none; border: none; color: #71767b; cursor: pointer; font-size: 1.2rem; }
        .modal-body { padding: 1rem; }
        .modal-footer { padding: 1rem; border-top: 1px solid #2f3336; display: flex; justify-content: flex-end; gap: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.75rem; color: #71767b; margin-bottom: 0.3rem; }
        .form-input, .form-select { width: 100%; padding: 0.5rem; background: #2f3336; border: 1px solid #3f4346; border-radius: 6px; color: #e7e9ea; font-size: 0.85rem; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #1d9bf0; }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="logo-icon">&#128021;</span>
            <h1>dogwatch<span>eBPF Dashboard</span></h1>
        </div>
        <div class="header-controls">
            <div class="status">
                <div class="status-dot"></div>
                <span id="last-update">Connecting...</span>
            </div>
            <select id="dashboard-select" class="form-select" style="width: 150px; padding: 0.4rem; font-size: 0.75rem;" onchange="loadDashboard(this.value)">
                <option value="">Default Layout</option>
            </select>
            <button class="btn" onclick="saveDashboard()">Save</button>
            <button class="btn" onclick="showDashboardManager()">Dashboards</button>
            <button class="btn" onclick="resetLayout()">Reset Layout</button>
            <button class="btn btn-primary" onclick="grid.compact()">Compact</button>
        </div>
    </div>

    <div class="grid-stack"></div>

    <script>
        // Widget definitions
        const defaultLayout = [
            // Row 0: System metrics
            { id: 'cpu', x: 0, y: 0, w: 3, h: 2, minW: 2, minH: 2 },
            { id: 'mem', x: 3, y: 0, w: 3, h: 2, minW: 2, minH: 2 },
            { id: 'disk', x: 6, y: 0, w: 3, h: 2, minW: 2, minH: 2 },
            { id: 'net', x: 9, y: 0, w: 3, h: 2, minW: 2, minH: 2 },
            // Row 2: Stats + Service map
            { id: 'conns', x: 0, y: 2, w: 2, h: 2, minW: 2, minH: 2 },
            { id: 'reqs', x: 2, y: 2, w: 2, h: 2, minW: 2, minH: 2 },
            { id: 'errs', x: 4, y: 2, w: 2, h: 2, minW: 2, minH: 2 },
            { id: 'svcmap', x: 6, y: 2, w: 6, h: 4, minW: 4, minH: 3 },
            // Row 4: Charts + Traces
            { id: 'cpuchart', x: 0, y: 4, w: 6, h: 3, minW: 4, minH: 3 },
            { id: 'memchart', x: 6, y: 6, w: 6, h: 3, minW: 4, minH: 3 },
            { id: 'traces', x: 0, y: 7, w: 6, h: 5, minW: 4, minH: 4 },
            { id: 'endpoints', x: 6, y: 9, w: 6, h: 4, minW: 4, minH: 3 },
            // Row 11: More widgets
            { id: 'watches', x: 6, y: 12, w: 6, h: 4, minW: 4, minH: 3 },
            { id: 'flamegraph', x: 0, y: 12, w: 6, h: 4, minW: 4, minH: 3 },
            { id: 'logs', x: 0, y: 16, w: 6, h: 5, minW: 6, minH: 4 },
            { id: 'patterns', x: 6, y: 16, w: 6, h: 5, minW: 4, minH: 4 },
            { id: 'slos', x: 0, y: 21, w: 6, h: 5, minW: 4, minH: 4 },
            { id: 'synthetics', x: 6, y: 21, w: 6, h: 5, minW: 4, minH: 3 },
            { id: 'procs', x: 0, y: 26, w: 6, h: 4, minW: 3, minH: 3 },
            { id: 'connlist', x: 6, y: 26, w: 6, h: 3, minW: 3, minH: 3 },
            { id: 'containers', x: 0, y: 30, w: 12, h: 4, minW: 6, minH: 3 },
            { id: 'deployments', x: 0, y: 34, w: 6, h: 4, minW: 4, minH: 3 },
            { id: 'incidents', x: 6, y: 34, w: 6, h: 4, minW: 4, minH: 3 },
            { id: 'cluster', x: 0, y: 38, w: 12, h: 4, minW: 6, minH: 3 },
        ];

        function widgetCPU() {
            return `<div class="widget-header"><span class="widget-title">CPU</span></div>
                <div class="widget-body">
                    <div class="metric-big" id="cpu-percent">--%</div>
                    <div class="metric-bar"><div class="metric-bar-fill cpu" id="cpu-bar" style="width:0%"></div></div>
                    <div class="metric-detail"><span>Load: <span id="load-avg">--</span></span><span>IO: <span id="cpu-iowait">--%</span></span></div>
                </div>`;
        }
        function widgetMem() {
            return `<div class="widget-header"><span class="widget-title">Memory</span></div>
                <div class="widget-body">
                    <div class="metric-big" id="mem-percent">--%</div>
                    <div class="metric-bar"><div class="metric-bar-fill mem" id="mem-bar" style="width:0%"></div></div>
                    <div class="metric-detail"><span id="mem-used">--</span><span id="mem-total">--</span></div>
                </div>`;
        }
        function widgetDisk() {
            return `<div class="widget-header"><span class="widget-title">Disk I/O</span></div>
                <div class="widget-body">
                    <div class="metric-big" id="disk-io">--</div>
                    <div class="metric-bar"><div class="metric-bar-fill disk" id="disk-bar" style="width:0%"></div></div>
                    <div class="metric-detail"><span>R: <span id="disk-read">--</span></span><span>W: <span id="disk-write">--</span></span></div>
                </div>`;
        }
        function widgetNet() {
            return `<div class="widget-header"><span class="widget-title">Network</span></div>
                <div class="widget-body">
                    <div class="metric-big" id="net-io">--</div>
                    <div class="metric-bar"><div class="metric-bar-fill net" id="net-bar" style="width:0%"></div></div>
                    <div class="metric-detail"><span>RX: <span id="net-rx">--</span></span><span>TX: <span id="net-tx">--</span></span></div>
                </div>`;
        }
        function widgetStat(title, id, isError) {
            return `<div class="widget-header"><span class="widget-title">${title}</span></div>
                <div class="widget-body" style="display:flex;align-items:center;justify-content:center;">
                    <div class="stat-big ${isError ? 'error' : ''}" id="${id}">-</div>
                </div>`;
        }
        function widgetServiceMap() {
            return `<div class="widget-header"><span class="widget-title">Service Map</span></div>
                <div class="widget-body no-pad" style="position:relative;"><svg id="service-map" style="position:absolute;inset:0;"></svg></div>`;
        }
        function widgetChart(title, id) {
            return `<div class="widget-header">
                    <span class="widget-title">${title}</span>
                    <div class="time-btns">
                        <button class="time-btn active" data-dur="15m">15m</button>
                        <button class="time-btn" data-dur="1h">1h</button>
                        <button class="time-btn" data-dur="6h">6h</button>
                    </div>
                </div>
                <div class="widget-body" style="position:relative;"><div class="chart-wrap"><canvas id="${id}"></canvas></div></div>`;
        }
        function widgetEndpoints() {
            return `<div class="widget-header"><span class="widget-title">HTTP Endpoints</span></div>
                <div class="widget-body no-pad" style="overflow:auto;">
                    <table><thead><tr><th>Method</th><th>Path</th><th>Count</th><th>Err%</th><th>P50</th><th>P99</th></tr></thead>
                    <tbody id="endpoints-body"><tr><td colspan="6" class="empty-state">No data</td></tr></tbody></table>
                </div>`;
        }
        function widgetConnections() {
            return `<div class="widget-header"><span class="widget-title">Connections</span></div>
                <div class="widget-body no-pad" style="overflow:auto;">
                    <table><thead><tr><th>Process</th><th>Remote</th><th>Count</th></tr></thead>
                    <tbody id="connections-body"><tr><td colspan="3" class="empty-state">No data</td></tr></tbody></table>
                </div>`;
        }
        function widgetProcesses() {
            return `<div class="widget-header"><span class="widget-title">Top Processes</span></div>
                <div class="widget-body no-pad" style="overflow:auto;">
                    <table><thead><tr><th>PID</th><th>Name</th><th>CPU%</th><th>Mem</th></tr></thead>
                    <tbody id="processes-body"><tr><td colspan="4" class="empty-state">Loading...</td></tr></tbody></table>
                </div>`;
        }
        function widgetFlameGraph() {
            return `<div class="widget-header">
                    <span class="widget-title">CPU Flame Graph</span>
                    <div><button class="btn" onclick="updateFlameGraph()">Refresh</button></div>
                </div>
                <div class="widget-body no-pad" style="position:relative;"><div id="flamegraph" style="position:absolute;inset:0;background:#1a1f2e;overflow:auto;"></div></div>`;
        }
        function widgetTraces() {
            return `<div class="widget-header">
                    <span class="widget-title">Distributed Traces</span>
                    <div class="trace-controls">
                        <select id="trace-service-filter" class="trace-select" onchange="loadTraces()">
                            <option value="">All Services</option>
                        </select>
                        <button class="btn" onclick="loadTraces()">Refresh</button>
                    </div>
                </div>
                <div class="widget-body no-pad" style="display:flex;flex-direction:column;height:100%;">
                    <div class="trace-list" id="trace-list">
                        <div class="empty-state">No traces yet. Configure OTLP export to http://localhost:9999/v1/traces</div>
                    </div>
                    <div id="trace-detail" style="flex:1;overflow:auto;">
                        <div class="no-trace-selected">Select a trace to view details</div>
                    </div>
                </div>`;
        }
        function widgetWatches() {
            return `<div class="widget-header">
                    <span class="widget-title">Watches</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="showChannels()">Channels</button>
                        <button class="btn btn-primary" onclick="showCreateWatch()">+ New</button>
                    </div>
                </div>
                <div class="widget-body no-pad" id="watches-list" style="overflow:auto;">
                    <div class="empty-state">No watches configured</div>
                </div>`;
        }
        function widgetLogs() {
            return `<div class="widget-header">
                    <span class="widget-title">Logs</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="refreshLogs()">Refresh</button>
                    </div>
                </div>
                <div class="log-controls">
                    <input type="text" id="log-search" placeholder="Search logs..." onkeyup="if(event.key==='Enter')searchLogs()">
                    <select id="log-level" onchange="searchLogs()">
                        <option value="">All Levels</option>
                        <option value="debug">Debug</option>
                        <option value="info">Info</option>
                        <option value="warn">Warn</option>
                        <option value="error">Error</option>
                        <option value="fatal">Fatal</option>
                    </select>
                    <select id="log-service" onchange="searchLogs()">
                        <option value="">All Services</option>
                    </select>
                    <select id="log-time" onchange="searchLogs()">
                        <option value="1h">Last 1h</option>
                        <option value="6h">Last 6h</option>
                        <option value="24h">Last 24h</option>
                        <option value="7d">Last 7d</option>
                    </select>
                </div>
                <div class="widget-body no-pad" id="logs-list" style="overflow:auto;">
                    <div class="empty-state">No logs yet</div>
                </div>`;
        }
        function widgetSynthetics() {
            return `<div class="widget-header">
                    <span class="widget-title">Synthetic Checks</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn btn-primary" onclick="showCreateSynthetic()">+ New</button>
                    </div>
                </div>
                <div class="widget-body no-pad" id="synthetics-list" style="overflow:auto;">
                    <div class="empty-state">No synthetic checks configured</div>
                </div>`;
        }
        function widgetSLOs() {
            return `<div class="widget-header">
                    <span class="widget-title">Service Level Objectives</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn btn-primary" onclick="showCreateSLO()">+ New</button>
                    </div>
                </div>
                <div class="widget-body no-pad" id="slos-list" style="overflow:auto;">
                    <div class="empty-state">No SLOs configured</div>
                </div>`;
        }
        function widgetPatterns() {
            return `<div class="widget-header">
                    <span class="widget-title">Log Patterns</span>
                    <div style="display:flex;gap:0.3rem;">
                        <select id="pattern-filter" onchange="loadPatterns()">
                            <option value="all">All Patterns</option>
                            <option value="new">New (24h)</option>
                            <option value="increasing">Increasing</option>
                        </select>
                        <button class="btn" onclick="loadPatterns()">Refresh</button>
                    </div>
                </div>
                <div class="pattern-stats" id="pattern-stats"></div>
                <div class="widget-body no-pad" id="patterns-list" style="overflow:auto;">
                    <div class="empty-state">No patterns detected yet</div>
                </div>`;
        }
        function widgetContainers() {
            return `<div class="widget-header">
                    <span class="widget-title">Containers</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="loadContainers()">Refresh</button>
                    </div>
                </div>
                <div class="container-summary" id="container-summary"></div>
                <div class="widget-body no-pad" id="containers-list" style="overflow:auto;">
                    <div class="empty-state">No containers found</div>
                </div>`;
        }
        function widgetDeployments() {
            return `<div class="widget-header">
                    <span class="widget-title">Deployments</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="showNewDeployModal()">+ Deploy</button>
                        <button class="btn" onclick="loadDeployments()">Refresh</button>
                    </div>
                </div>
                <div class="deploy-summary" id="deploy-summary"></div>
                <div class="widget-body no-pad" id="deployments-list" style="overflow:auto;">
                    <div class="empty-state">No deployments recorded</div>
                </div>`;
        }

        function widgetIncidents() {
            return `<div class="widget-header">
                    <span class="widget-title">Incidents</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="showNewIncidentModal()">+ Incident</button>
                        <button class="btn" onclick="loadIncidents()">Refresh</button>
                    </div>
                </div>
                <div class="incident-summary" id="incident-summary">
                    <div class="incident-stat">
                        <span class="incident-stat-value" id="inc-active">0</span>
                        <span class="incident-stat-label">Active</span>
                    </div>
                    <div class="incident-stat">
                        <span class="incident-stat-value" id="inc-triggered" style="color:#f4212e">0</span>
                        <span class="incident-stat-label">Triggered</span>
                    </div>
                    <div class="incident-stat">
                        <span class="incident-stat-value" id="inc-acked" style="color:#ffd400">0</span>
                        <span class="incident-stat-label">Acked</span>
                    </div>
                    <div id="oncall-display" style="margin-left:auto;"></div>
                </div>
                <div class="widget-body no-pad" id="incidents-list" style="overflow:auto;">
                    <div class="empty-state">No active incidents</div>
                </div>`;
        }

        function widgetCluster() {
            return `<div class="widget-header">
                    <span class="widget-title">Federation Cluster</span>
                    <div style="display:flex;gap:0.3rem;">
                        <button class="btn" onclick="showJoinClusterModal()">Join Node</button>
                        <button class="btn" onclick="loadCluster()">Refresh</button>
                    </div>
                </div>
                <div class="cluster-summary" id="cluster-summary">
                    <div class="cluster-stat">
                        <span class="cluster-stat-value" id="cluster-enabled">-</span>
                        <span class="cluster-stat-label">Status</span>
                    </div>
                    <div class="cluster-stat">
                        <span class="cluster-stat-value" id="cluster-nodes">0</span>
                        <span class="cluster-stat-label">Nodes</span>
                    </div>
                    <div class="cluster-stat">
                        <span class="cluster-stat-value" id="cluster-incidents">0</span>
                        <span class="cluster-stat-label">Active Incidents</span>
                    </div>
                    <div id="cluster-local" style="margin-left:auto;font-size:0.75rem;color:#888;"></div>
                </div>
                <div class="widget-body no-pad" id="cluster-nodes-list" style="overflow:auto;">
                    <div class="empty-state">Federation not enabled. Start with --cluster flag.</div>
                </div>`;
        }

        // Initialize GridStack
        const grid = GridStack.init({
            column: 12,
            cellHeight: 70,
            margin: 8,
            float: false,
            animate: true,
            draggable: { handle: '.widget-header' },
            resizable: { handles: 'se,e,s' },
            minRow: 1
        });

        // Load saved or default layout
        function loadLayout() {
            const saved = localStorage.getItem('dogwatch-layout');
            let items = saved ? JSON.parse(saved) : defaultLayout;

            // Merge with defaults to ensure minW/minH constraints are preserved
            const defaultsById = {};
            defaultLayout.forEach(d => defaultsById[d.id] = d);

            items = items.map(item => {
                const defaults = defaultsById[item.id] || {};
                return {
                    ...defaults,
                    ...item,
                    content: `<div class="gs-item-content">${getWidgetContent(item.id)}</div>`
                };
            });

            grid.load(items);
        }

        function getWidgetContent(id) {
            const map = {
                cpu: widgetCPU, mem: widgetMem, disk: widgetDisk, net: widgetNet,
                conns: () => widgetStat('Connections', 'total-connections'),
                reqs: () => widgetStat('Requests', 'total-requests'),
                errs: () => widgetStat('Errors', 'total-errors', true),
                svcmap: widgetServiceMap,
                traces: widgetTraces,
                watches: widgetWatches,
                logs: widgetLogs,
                synthetics: widgetSynthetics,
                slos: widgetSLOs,
                patterns: widgetPatterns,
                containers: widgetContainers,
                deployments: widgetDeployments,
                incidents: widgetIncidents,
                cluster: widgetCluster,
                cpuchart: () => widgetChart('CPU History', 'cpu-chart'),
                memchart: () => widgetChart('Memory History', 'mem-chart'),
                endpoints: widgetEndpoints,
                connlist: widgetConnections,
                procs: widgetProcesses,
                flamegraph: widgetFlameGraph
            };
            return map[id] ? map[id]() : '';
        }

        function saveLayout() {
            const items = grid.save(false);
            localStorage.setItem('dogwatch-layout', JSON.stringify(items));
        }

        function resetLayout() {
            localStorage.removeItem('dogwatch-layout');
            currentDashboardId = null;
            document.getElementById('dashboard-select').value = '';
            grid.removeAll();
            loadLayout();
            setTimeout(initCharts, 100);
        }

        // Dashboard persistence
        let currentDashboardId = null;
        let dashboards = [];

        async function loadDashboards() {
            try {
                const resp = await fetch('/api/dashboards');
                dashboards = await resp.json() || [];
                const select = document.getElementById('dashboard-select');
                select.innerHTML = '<option value="">Default Layout</option>';
                dashboards.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name + (d.is_default ? ' *' : '');
                    select.appendChild(opt);
                });
                // Load default dashboard if exists
                const defaultDash = dashboards.find(d => d.is_default);
                if (defaultDash && !localStorage.getItem('dogwatch-layout')) {
                    currentDashboardId = defaultDash.id;
                    select.value = defaultDash.id;
                    applyDashboardLayout(defaultDash.layout);
                }
            } catch (e) { console.error('Failed to load dashboards:', e); }
        }

        function applyDashboardLayout(layout) {
            if (!layout || !layout.length) return;
            grid.removeAll();
            layout.forEach(pos => {
                const widgetDef = defaultLayout.find(w => w.id === pos.id);
                if (widgetDef) {
                    const content = getWidgetContent(pos.id);
                    grid.addWidget({
                        id: pos.id,
                        x: pos.x, y: pos.y, w: pos.w, h: pos.h,
                        minW: widgetDef.minW, minH: widgetDef.minH,
                        content: content
                    });
                }
            });
            setTimeout(initCharts, 100);
        }

        async function loadDashboard(id) {
            if (!id) {
                currentDashboardId = null;
                resetLayout();
                return;
            }
            try {
                const resp = await fetch(`/api/dashboards/${id}`);
                const dash = await resp.json();
                currentDashboardId = id;
                applyDashboardLayout(dash.layout);
            } catch (e) { alert('Failed to load dashboard'); }
        }

        async function saveDashboard() {
            const layout = grid.save(false).map(item => ({
                id: item.id, x: item.x, y: item.y, w: item.w, h: item.h
            }));

            if (currentDashboardId) {
                // Update existing dashboard
                const dash = dashboards.find(d => d.id === currentDashboardId);
                const name = prompt('Dashboard name:', dash?.name || 'My Dashboard');
                if (!name) return;
                try {
                    await fetch(`/api/dashboards/${currentDashboardId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, layout })
                    });
                    loadDashboards();
                } catch (e) { alert('Failed to save dashboard'); }
            } else {
                // Create new dashboard
                const name = prompt('Dashboard name:', 'My Dashboard');
                if (!name) return;
                try {
                    const resp = await fetch('/api/dashboards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, layout, is_default: false })
                    });
                    const dash = await resp.json();
                    currentDashboardId = dash.id;
                    loadDashboards();
                    document.getElementById('dashboard-select').value = dash.id;
                } catch (e) { alert('Failed to create dashboard'); }
            }
        }

        async function deleteDashboard(id) {
            if (!confirm('Delete this dashboard?')) return;
            try {

                    currentDashboardId = null;

        // Utility functions
        function formatBytes(b) {
            if (b === 0) return '0 B';
            const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return (b / Math.pow(k, i)).toFixed(1) + ' ' + s[i];
        }
        function formatBPS(b) { return formatBytes(b) + '/s'; }
        function formatLatency(ms) {
            if (!ms) return '-';
            return ms < 1 ? '<1ms' : ms < 1000 ? Math.round(ms) + 'ms' : (ms/1000).toFixed(1) + 's';
        }
        function getLatencyClass(ms) { return !ms ? '' : ms < 100 ? 'good' : ms < 500 ? 'warn' : 'bad'; }
        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        // Data fetching
        function updateSystemMetrics() {
            fetch('/api/system').then(r => r.json()).then(d => {
                const cpu = d.cpu_usage_percent || 0;
                document.getElementById('cpu-percent').textContent = cpu.toFixed(1) + '%';
                document.getElementById('cpu-bar').style.width = cpu + '%';
                document.getElementById('cpu-iowait').textContent = (d.cpu_iowait || 0).toFixed(1) + '%';
                document.getElementById('load-avg').textContent = (d.load_1 || 0).toFixed(2);

                const mem = d.mem_usage_percent || 0;
                document.getElementById('mem-percent').textContent = mem.toFixed(1) + '%';
                document.getElementById('mem-bar').style.width = mem + '%';
                document.getElementById('mem-used').textContent = formatBytes(d.mem_used_bytes || 0);
                document.getElementById('mem-total').textContent = formatBytes(d.mem_total_bytes || 0);

                const dr = d.disk_read_per_sec || 0, dw = d.disk_write_per_sec || 0;
                document.getElementById('disk-io').textContent = formatBPS(dr + dw);
                document.getElementById('disk-read').textContent = formatBPS(dr);
                document.getElementById('disk-write').textContent = formatBPS(dw);
                document.getElementById('disk-bar').style.width = Math.min((dr + dw) / 1e8 * 100, 100) + '%';

                const nr = d.net_rx_per_sec || 0, nt = d.net_tx_per_sec || 0;
                document.getElementById('net-io').textContent = formatBPS(nr + nt);
                document.getElementById('net-rx').textContent = formatBPS(nr);
                document.getElementById('net-tx').textContent = formatBPS(nt);
                document.getElementById('net-bar').style.width = Math.min((nr + nt) / 1e7 * 100, 100) + '%';
            }).catch(() => {});
        }

        // Service map
        let svcMapData = { nodes: [], links: [] };
        function updateServiceMap() {
            fetch('/api/servicemap').then(r => r.json()).then(d => {
                svcMapData = d;
                renderServiceMap();
            }).catch(() => {});
        }

        function renderServiceMap() {
            const svg = d3.select('#service-map');
            const rect = svg.node()?.getBoundingClientRect();
            if (!rect || rect.width < 50) return;
            const w = rect.width, h = rect.height;
            svg.attr('viewBox', `0 0 ${w} ${h}`);

            if (!svcMapData.nodes.length) {
                svg.selectAll('*').remove();
                svg.append('text').attr('x', w/2).attr('y', h/2).attr('text-anchor', 'middle').attr('fill', '#71767b').text('No connections');
                return;
            }

            svg.selectAll('*').remove();
            const nodes = svcMapData.nodes.map(n => ({...n}));
            const links = svcMapData.links.map(l => ({...l}));

            const sim = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-200))
                .force('center', d3.forceCenter(w/2, h/2));

            const link = svg.append('g').selectAll('line').data(links).enter().append('line').attr('class', 'link');
            const node = svg.append('g').selectAll('g').data(nodes).enter().append('g');
            node.append('circle').attr('r', 12).attr('class', d =>
                d.type === 'service' ? 'node-service' : d.type === 'process' ? 'node-process' : 'node-external');
            node.append('text').attr('class', 'node-label').attr('text-anchor', 'middle').attr('dy', 25)
                .text(d => d.name.length > 12 ? d.name.slice(0,10) + '..' : d.name);

            sim.on('tick', () => {
                link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        // Charts
        let cpuChart, memChart;
        const chartOpts = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { type: 'time', grid: { color: '#2f3336' }, ticks: { color: '#71767b', font: { size: 9 } } },
                y: { grid: { color: '#2f3336' }, ticks: { color: '#71767b', font: { size: 9 } }, beginAtZero: true, max: 100 }
            }
        };

        function initCharts() {
            const cpuCanvas = document.getElementById('cpu-chart');
            const memCanvas = document.getElementById('mem-chart');
            if (cpuCanvas && !cpuChart) {
                cpuChart = new Chart(cpuCanvas.getContext('2d'), {
                    type: 'line',
                    data: { datasets: [{ data: [], borderColor: '#1d9bf0', backgroundColor: 'rgba(29,155,240,0.1)', fill: true, tension: 0.3 }] },
                    options: chartOpts
                });
            }
            if (memCanvas && !memChart) {
                memChart = new Chart(memCanvas.getContext('2d'), {
                    type: 'line',
                    data: { datasets: [{ data: [], borderColor: '#00ba7c', backgroundColor: 'rgba(0,186,124,0.1)', fill: true, tension: 0.3 }] },
                    options: {...chartOpts}
                });
            }
            // Time button handlers
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.onclick = function() {
                    this.parentElement.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    loadChartData(this.dataset.dur);
                };
            });
            loadChartData('15m');
        }

        function loadChartData(dur) {
            fetch(`/api/history/system?duration=${dur}`).then(r => r.json()).then(data => {
                if (!data?.length) return;
                const now = Date.now();
                const durMs = dur.includes('h') ? parseInt(dur)*3600000 : parseInt(dur)*60000;

                if (cpuChart) {
                    cpuChart.data.datasets[0].data = data.map(d => ({ x: new Date(d.timestamp), y: d.cpu_percent }));
                    cpuChart.options.scales.x.min = now - durMs;
                    cpuChart.options.scales.x.max = now;
                    cpuChart.update('none');
                }
                if (memChart) {
                    memChart.data.datasets[0].data = data.map(d => ({ x: new Date(d.timestamp), y: d.mem_percent }));
                    memChart.options.scales.x.min = now - durMs;
                    memChart.options.scales.x.max = now;
                    memChart.update('none');
                }
            }).catch(() => {});
        }

        // Traces
        let selectedTraceId = null;
        let traceServices = [];

        function loadTraceServices() {
            fetch('/api/trace/services').then(r => r.json()).then(services => {
                traceServices = services || [];
                const select = document.getElementById('trace-service-filter');
                if (select) {

        function loadTraces() {
            const service = document.getElementById('trace-service-filter')?.value || '';
            const url = `/api/traces?limit=50&duration=1h${service ? '&service=' + encodeURIComponent(service) : ''}`;

            fetch(url).then(r => r.json()).then(traces => {
                const list = document.getElementById('trace-list');
                if (!list) return;

                if (!traces?.length) {
                    list.innerHTML = '<div class="empty-state">No traces yet. Configure OTLP export to http://localhost:9999/v1/traces</div>';
                    return;
                }

                list.innerHTML = traces.map(t => {
                    const statusClass = (t.status || '').toLowerCase();
                    const time = new Date(t.start_time).toLocaleTimeString();
                    return `<div class="trace-item ${t.trace_id === selectedTraceId ? 'selected' : ''}" onclick="selectTrace('${t.trace_id}')">
                        <div>
                            <span class="trace-status ${statusClass}"></span>
                            <span class="trace-name">${escapeHtml(t.name || 'unknown')}</span>
                            <div class="trace-service">${escapeHtml(t.service_name || 'unknown')} (${t.span_count} spans)</div>
                        </div>
                        <div class="trace-meta">
                            <div class="trace-duration">${formatTraceDuration(t.duration_ms)}</div>
                            <div class="trace-time">${time}</div>
                        </div>
                    </div>`;
                }).join('');
            }).catch(() => {});
        }

        function selectTrace(traceId) {
            selectedTraceId = traceId;
            document.querySelectorAll('.trace-item').forEach(el => {
                el.classList.toggle('selected', el.onclick.toString().includes(traceId));
            });
            loadTraceDetail(traceId);
        }

        function loadTraceDetail(traceId) {
            const detail = document.getElementById('trace-detail');
            if (!detail) return;

            fetch(`/api/traces/${traceId}`).then(r => r.json()).then(trace => {
                if (!trace?.spans?.length) {
                    detail.innerHTML = '<div class="no-trace-selected">No spans found</div>';
                    return;
                }

                // Build waterfall
                const spans = trace.spans;
                const minTime = Math.min(...spans.map(s => new Date(s.start_time).getTime()));
                const maxTime = Math.max(...spans.map(s => new Date(s.end_time).getTime()));
                const totalDuration = maxTime - minTime;

                // Sort by start time and build tree structure
                spans.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

                // Assign colors to services
                const serviceColors = {};
                const colors = ['#1d9bf0', '#00ba7c', '#7c3aed', '#f4212e', '#ffd400', '#ff7a00'];
                let colorIdx = 0;
                spans.forEach(s => {
                    if (!serviceColors[s.service_name]) {
                        serviceColors[s.service_name] = colors[colorIdx++ % colors.length];
                    }
                });

                const timeMarkers = [0, 0.25, 0.5, 0.75, 1].map(p => formatTraceDuration(totalDuration * p));

                detail.innerHTML = `
                    <div class="waterfall">
                        <div class="waterfall-header">
                            <span style="width:180px">Operation</span>
                            <div style="flex:1;display:flex;justify-content:space-between;">
                                ${timeMarkers.map(m => `<span>${m}</span>`).join('')}
                            </div>
                        </div>
                        ${spans.map(span => {
                            const startOffset = new Date(span.start_time).getTime() - minTime;
                            const left = totalDuration > 0 ? (startOffset / totalDuration * 100) : 0;
                            const width = totalDuration > 0 ? (span.duration_ms / totalDuration * 100) : 100;
                            const barClass = span.status === 'ERROR' ? 'error' :
                                (span.kind || '').toLowerCase() === 'client' ? 'client' :
                                (span.kind || '').toLowerCase() === 'internal' ? 'internal' : 'server';

                            return `<div class="span-row">
                                <div class="span-info">
                                    <div class="span-name" title="${escapeHtml(span.name)}">${escapeHtml(span.name)}</div>
                                    <div class="span-service" style="color:${serviceColors[span.service_name]}">${escapeHtml(span.service_name)}</div>
                                </div>
                                <div class="span-timeline">
                                    <div class="timeline-grid">${'<div class="timeline-grid-line"></div>'.repeat(4)}</div>
                                    <div class="span-bar ${barClass}" style="left:${left}%;width:${Math.max(width, 0.5)}%;background:${serviceColors[span.service_name]}"></div>
                                    <span class="span-duration">${formatTraceDuration(span.duration_ms)}</span>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                `;
            }).catch(() => {
                detail.innerHTML = '<div class="no-trace-selected">Failed to load trace</div>';
            });
        }

        function formatTraceDuration(ms) {
            if (ms === undefined || ms === null) return '-';
            if (ms < 1) return '<1ms';
            if (ms < 1000) return Math.round(ms) + 'ms';
            if (ms < 60000) return (ms / 1000).toFixed(2) + 's';
            return (ms / 60000).toFixed(1) + 'm';
        }

            const interval = parseInt(document.getElementById('synth-interval').value) || 60;

            if (expectedStatus) {
                assertions.push({
                    type: 'status_code',
                    operator: 'equals',
                    value: expectedStatus

            }

            fetch('/api/synthetics/checks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name, url, method, interval, timeout,
                    type: 'http',
                    enabled: true,
                    assertions

            }).then(r => {
                if (!r.ok) throw new Error('Failed to create check');
                return r.json();

                .then(data => {
                    const stats = data.stats || {};

                    // Update stats

                    if (statsEl) {
                        statsEl.innerHTML = `
                            <div class="pattern-stat">

                        list.innerHTML = '<div class="empty-state">No patterns detected yet. Send some logs to see patterns emerge.</div>';
                        return;
                    }

                    list.innerHTML = patterns.map(p => {
                        const trend = p.trend || 'stable';
                        const trendLabel = trend === 'increasing' ? 'Increasing' :
                                          trend === 'decreasing' ? 'Decreasing' :
                                          trend === 'new' ? 'New' : 'Stable';
                        const examples = (p.examples || []).slice(0, 2);
                        const lastSeen = p.last_seen ? new Date(p.last_seen).toLocaleString() : '-';

                        return `<div class="pattern-item">
                            <div class="pattern-header">
                                <span class="pattern-trend ${trend}">${trendLabel}</span>
                                <span class="pattern-count">${p.count.toLocaleString()} occurrences</span>

                            </div>

        // Container functions
        function loadContainers() {
            fetch('/api/containers')
                .then(r => r.json())
                .then(data => {
                    if (!Array.isArray(data)) data = [];

                    // Update summary
                    const running = data.filter(d => d.container?.state === 'running').length;
                    const stopped = data.filter(d => d.container?.state !== 'running').length;
                    let totalCpu = 0, totalMem = 0;
                    data.forEach(d => {
                        if (d.stats) {
                            totalCpu += d.stats.cpu_percent || 0;
                            totalMem += d.stats.memory_usage || 0;
                        }
                    });

                    const summaryEl = document.getElementById('container-summary');
                    if (summaryEl) {
                        summaryEl.innerHTML = `
                            <div class="container-stat">
                                <span class="container-stat-value">${data.length}</span>
                                <span class="container-stat-label">Total</span>
                            </div>
                            <div class="container-stat">
                                <span class="container-stat-value" style="color:#00ba7c">${running}</span>
                                <span class="container-stat-label">Running</span>
                            </div>
                            <div class="container-stat">
                                <span class="container-stat-value" style="color:#71767b">${stopped}</span>
                                <span class="container-stat-label">Stopped</span>
                            </div>
                            <div class="container-stat">
                                <span class="container-stat-value">${totalCpu.toFixed(1)}%</span>
                                <span class="container-stat-label">CPU</span>
                            </div>
                            <div class="container-stat">
                                <span class="container-stat-value">${formatBytes(totalMem)}</span>
                                <span class="container-stat-label">Memory</span>
                            </div>
                        `;
                    }

                    // Update list
                    const list = document.getElementById('containers-list');
                    if (!list) return;

                    if (!data.length) {
                        list.innerHTML = '<div class="empty-state">No containers found. Is Docker running?</div>';
                        return;
                    }

                    list.innerHTML = data.map(d => {
                        const c = d.container || {};
                        const s = d.stats || {};
                        const state = c.state || 'unknown';
                        const cpuPct = (s.cpu_percent || 0).toFixed(1);
                        const memPct = (s.memory_percent || 0).toFixed(1);
                        const memUsed = formatBytes(s.memory_usage || 0);
                        const netRx = formatBytes(s.network_rx_bytes || 0);
                        const netTx = formatBytes(s.network_tx_bytes || 0);

                        return `<div class="container-item">
                            <div class="container-header">
                                <span class="container-state ${state}">${state}</span>
                                <span class="container-name">${escapeHtml(c.name || c.id)}</span>
                            </div>
                            <div class="container-image">${escapeHtml(c.image || '-')}</div>
                            ${state === 'running' ? `
                            <div class="container-metrics">
                                <div class="container-metric">
                                    <span class="container-metric-value">${cpuPct}%</span>
                                    <span class="container-metric-label">CPU</span>
                                    <div class="container-bar"><div class="container-bar-fill cpu" style="width:${Math.min(cpuPct, 100)}%"></div></div>
                                </div>
                                <div class="container-metric">
                                    <span class="container-metric-value">${memUsed}</span>
                                    <span class="container-metric-label">Memory (${memPct}%)</span>
                                    <div class="container-bar"><div class="container-bar-fill mem" style="width:${Math.min(memPct, 100)}%"></div></div>
                                </div>
                                <div class="container-metric">
                                    <span class="container-metric-value">${netRx} / ${netTx}</span>
                                    <span class="container-metric-label">Net RX / TX</span>
                                </div>
                                <div class="container-metric">
                                    <span class="container-metric-value">${s.pids || 0}</span>
                                    <span class="container-metric-label">PIDs</span>
                                </div>
                            </div>
                            ` : `<div style="font-size:0.7rem;color:#71767b;margin-top:0.3rem;">${escapeHtml(c.status || '')}</div>`}
                        </div>`;
                    }).join('');
                })

                    if (list) list.innerHTML = '<div class="empty-state">Container monitoring not available</div>';

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function submitDeploy() {
            const service = document.getElementById('deploy-service').value.trim();
            const version = document.getElementById('deploy-version').value.trim();
            if (!service || !version) {
                alert('Service and Version are required');
                return;
            }

            const deploy = {
                service: service,
                version: version,
                environment: document.getElementById('deploy-env').value,
                status: document.getElementById('deploy-status').value,
                user: document.getElementById('deploy-user').value.trim(),
                commit_sha: document.getElementById('deploy-sha').value.trim(),
                commit_url: document.getElementById('deploy-url').value.trim(),
                description: document.getElementById('deploy-desc').value.trim()
            };

            fetch('/api/deploys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(deploy)
            })
            .then(r => {
                if (!r.ok) throw new Error('Failed to record deploy');
                return r.json();
            })
            .then(() => {
                document.querySelector('.modal-overlay').remove();
                loadDeployments();
            })
            .catch(err => alert('Error: ' + err.message));
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
