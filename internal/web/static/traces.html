<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traces - dogwatch</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        :root {
            --bg: #0f1419;
            --bg-card: #16181c;
            --bg-elevated: #1e2128;
            --border: #2f3336;
            --text: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --success: #00ba7c;
            --error: #f4212e;
            --warning: #ffd400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { border-color: var(--accent); }
        .btn-primary { background: var(--accent); border-color: var(--accent); }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .page-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 1.5rem;
            height: calc(100vh - 100px);
        }

        .trace-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .page-layout .trace-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 1rem;
        }

        .search-filters {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .filter-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filter-row {
            display: flex;
            gap: 0.5rem;
        }

        .filter-row > * {
            flex: 1;
        }

        .trace-list {
            flex: 1;
            overflow-y: auto;
        }

        .trace-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .trace-item:hover {
            background: var(--bg-elevated);
        }

        .trace-item.selected {
            background: rgba(29, 155, 240, 0.1);
            border-left: 3px solid var(--accent);
        }

        .trace-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .trace-item-service {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .trace-item-duration {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .trace-item-operation {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .trace-item-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .trace-item-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .trace-item-status.ok { background: var(--success); }
        .trace-item-status.error { background: var(--error); }

        .main-content {
            display: flex;
            flex-direction: column;
        }

        trace-waterfall {
            flex: 1;
            position: relative;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.75rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
            <div class="sidebar-header">
                <span class="logo-icon">&#128021;</span>
                <span class="logo-text">dogwatch</span>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="sidebar-item" data-tooltip="Dashboard">
                    <span class="icon">&#128200;</span>
                    <span class="label">Dashboard</span>
                </a>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Observability</div>
                    <a href="/traces.html" class="sidebar-item active" data-tooltip="Traces">
                        <span class="icon">&#128279;</span>
                        <span class="label">Traces</span>
                    </a>
                    <a href="/logs.html" class="sidebar-item" data-tooltip="Logs">
                        <span class="icon">&#128220;</span>
                        <span class="label">Logs</span>
                    </a>
                    <a href="/query-builder.html" class="sidebar-item" data-tooltip="Query">
                        <span class="icon">&#9889;</span>
                        <span class="label">Query</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Infrastructure</div>
                    <a href="/my-services" class="sidebar-item" data-tooltip="Services">
                        <span class="icon">&#128736;</span>
                        <span class="label">Services</span>
                    </a>
                    <a href="/entities" class="sidebar-item" data-tooltip="Entities">
                        <span class="icon">&#127970;</span>
                        <span class="label">Entities</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Monitoring</div>
                    <a href="/lookout" class="sidebar-item" data-tooltip="Lookout">
                        <span class="icon">&#128065;</span>
                        <span class="label">Lookout</span>
                    </a>
                    <a href="/bubbleup.html" class="sidebar-item" data-tooltip="BubbleUp">
                        <span class="icon">&#128200;</span>
                        <span class="label">BubbleUp</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar (Cmd+B)">
                    <span class="icon">&#9664;</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header-compact">
                <div class="header-left">
                    <span class="page-title">Distributed Tracing</span>
                </div>
                <div class="header-right"></div>
            </header>

            <div class="container">
                <div class="page-layout">
                    <!-- Trace Sidebar: Search & Trace List -->
                    <div class="trace-sidebar">
                <div class="panel">
                    <div class="panel-header">
                        Search Traces
                    </div>
                    <div class="panel-body">
                        <div class="search-filters">
                            <div class="filter-group">
                                <label>Service</label>
                                <select id="service-filter" onchange="searchTraces()">
                                    <option value="">All Services</option>
                                </select>
                            </div>
                            <div class="filter-row">
                                <div class="filter-group">
                                    <label>Min Duration</label>
                                    <input type="number" id="min-duration" placeholder="ms" onchange="searchTraces()">
                                </div>
                                <div class="filter-group">
                                    <label>Max Duration</label>
                                    <input type="number" id="max-duration" placeholder="ms" onchange="searchTraces()">
                                </div>
                            </div>
                            <div class="filter-group">
                                <label>Time Range</label>
                                <select id="time-range" onchange="searchTraces()">
                                    <option value="15m">Last 15 minutes</option>
                                    <option value="1h">Last 1 hour</option>
                                    <option value="6h">Last 6 hours</option>
                                    <option value="24h">Last 24 hours</option>
                                    <option value="7d">Last 7 days</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Status</label>
                                <select id="status-filter" onchange="searchTraces()">
                                    <option value="">All</option>
                                    <option value="error">Errors Only</option>
                                    <option value="ok">Success Only</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="searchTraces()" style="width: 100%;">
                                Search
                            </button>
                        </div>
                    </div>
                </div>

                <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                    <div class="panel-header">
                        <span>Recent Traces</span>
                        <span id="trace-count" style="font-size: 0.75rem; color: var(--text-muted);">0 traces</span>
                    </div>
                    <div class="trace-list" id="trace-list">
                        <div class="loading">
                            <div class="spinner"></div>
                            Loading traces...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content: Waterfall -->
            <div class="main-content">
                <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                    <div class="panel-header">
                        <span>Trace Details</span>
                        <span id="selected-trace-id" style="font-family: monospace; font-size: 0.75rem; color: var(--text-muted);"></span>
                    </div>
                    <trace-waterfall id="waterfall" style="flex: 1;"></trace-waterfall>
                </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/components/trace-waterfall.js"></script>
    <script>
        // Sidebar Resize
        (function() {
            const sidebar = document.getElementById('sidebar');
            const handle = document.getElementById('sidebar-resize-handle');
            const mainContent = document.querySelector('.main-content');

            let isResizing = false;
            let startX, startWidth;

            // Restore saved width
            const savedWidth = localStorage.getItem('sidebar-width');
            if (savedWidth) {
                const width = parseInt(savedWidth);
                if (width <= 56) {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                } else {
                    sidebar.classList.remove('collapsed');
                    sidebar.style.setProperty('--sidebar-width', savedWidth + 'px');
                    mainContent.style.marginLeft = savedWidth + 'px';
                }
            }

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                document.body.classList.add('sidebar-resizing');
                handle.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const diff = e.clientX - startX;
                let newWidth = startWidth + diff;
                if (newWidth < 80) {
                    newWidth = 56;
                    sidebar.classList.add('collapsed');
                } else {
                    sidebar.classList.remove('collapsed');
                    newWidth = Math.min(300, Math.max(120, newWidth));
                }
                sidebar.style.setProperty('--sidebar-width', newWidth + 'px');
                mainContent.style.marginLeft = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.classList.remove('sidebar-resizing');
                    handle.classList.remove('dragging');
                    localStorage.setItem('sidebar-width', sidebar.offsetWidth);
                }
            });

            // Toggle function
            window.toggleSidebar = function() {
                if (sidebar.classList.contains('collapsed')) {
                    sidebar.classList.remove('collapsed');
                    const saved = localStorage.getItem('sidebar-width');
                    const width = (saved && parseInt(saved) > 56) ? saved : 200;
                    sidebar.style.setProperty('--sidebar-width', width + 'px');
                    mainContent.style.marginLeft = width + 'px';
                    localStorage.setItem('sidebar-width', width);
                } else {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                    localStorage.setItem('sidebar-width', 56);
                }
            };

            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
                    e.preventDefault();
                    window.toggleSidebar();
                }
            });
        })();
    </script>
    <script>
        let traces = [];
        let selectedTraceId = null;

        // Load services for filter
        async function loadServices() {
            try {
                const resp = await fetch('/api/trace/services');
                if (resp.ok) {
                    const services = await resp.json();
                    const select = document.getElementById('service-filter');
                    services.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error('Failed to load services:', e);
            }
        }

        // Search traces
        async function searchTraces() {
            const list = document.getElementById('trace-list');
            list.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Searching...
                </div>
            `;

            try {
                const service = document.getElementById('service-filter').value;
                const timeRange = document.getElementById('time-range').value;
                const status = document.getElementById('status-filter').value;
                const minDuration = document.getElementById('min-duration').value;
                const maxDuration = document.getElementById('max-duration').value;

                const params = new URLSearchParams({ limit: '100' });
                if (service) params.append('service', service);
                if (timeRange) params.append('since', timeRange);

                const resp = await fetch(`/api/traces?${params}`);
                if (!resp.ok) throw new Error('Search failed');

                traces = await resp.json();

                // Client-side filtering
                if (status === 'error') {
                    traces = traces.filter(t => t.has_error);
                } else if (status === 'ok') {
                    traces = traces.filter(t => !t.has_error);
                }

                if (minDuration) {
                    traces = traces.filter(t => t.duration_ms >= parseFloat(minDuration));
                }
                if (maxDuration) {
                    traces = traces.filter(t => t.duration_ms <= parseFloat(maxDuration));
                }

                renderTraceList();
            } catch (e) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <p>Failed to load traces</p>
                    </div>
                `;
            }
        }

        // Render trace list
        function renderTraceList() {
            const list = document.getElementById('trace-list');
            const countEl = document.getElementById('trace-count');

            countEl.textContent = `${traces.length} traces`;

            if (traces.length === 0) {
                list.innerHTML = `
                    <div class="empty-state" style="padding: 2rem;">
                        <span class="icon">🔍</span>
                        <p>No traces found</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = traces.map(t => `
                <div class="trace-item ${t.trace_id === selectedTraceId ? 'selected' : ''}"
                     onclick="selectTrace('${t.trace_id}')">
                    <div class="trace-item-header">
                        <span class="trace-item-service">
                            <span class="trace-item-status ${t.has_error ? 'error' : 'ok'}"></span>
                            ${t.service_name || 'unknown'}
                        </span>
                        <span class="trace-item-duration">${formatDuration(t.duration_ms)}</span>
                    </div>
                    <div class="trace-item-operation">${t.root_span || 'unnamed'}</div>
                    <div class="trace-item-meta">
                        <span>${t.span_count || 0} spans</span>
                        <span>${formatTime(t.start_time)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Select a trace
        async function selectTrace(traceId) {
            selectedTraceId = traceId;

            // Update selection UI
            document.querySelectorAll('.trace-item').forEach(el => {
                el.classList.toggle('selected', el.onclick.toString().includes(traceId));
            });

            document.getElementById('selected-trace-id').textContent = traceId;

            // Load trace into waterfall
            const waterfall = document.getElementById('waterfall');
            waterfall.setAttribute('trace-id', traceId);
        }

        // Format duration
        function formatDuration(ms) {
            if (ms === undefined || ms === null) return '—';
            if (ms < 1) return `${(ms * 1000).toFixed(0)}μs`;
            if (ms < 1000) return `${ms.toFixed(1)}ms`;
            return `${(ms / 1000).toFixed(2)}s`;
        }

        // Format time
        function formatTime(timestamp) {
            if (!timestamp) return '—';
            const d = new Date(timestamp);
            return d.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadServices();
            searchTraces();
        });
    </script>
</body>
</html>
