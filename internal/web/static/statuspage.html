<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
    <link rel="stylesheet" href="/css/bundle.css">
    <link rel="stylesheet" href="/css/standalone.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: var(--color-black);
            --bg-secondary: var(--color-gray-800);
            --bg-tertiary: var(--color-gray-700);
            --border-color: #2f2f2f;
            --text-primary: #efefef;
            --text-secondary: #7d7d7d;
            --operational: var(--color-success);
            --degraded: var(--color-warning);
            --partial-outage: var(--color-warning-alt);
            --major-outage: var(--color-error);
            --maintenance: var(--color-info);
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-logo {
            max-height: 48px;
            margin-bottom: 0.5rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Overall Status Banner */
        .status-banner {
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .status-banner.operational {
            background: linear-gradient(135deg, rgba(0, 186, 124, 0.15) 0%, rgba(0, 186, 124, 0.05) 100%);
            border: 1px solid rgba(0, 186, 124, 0.3);
        }

        .status-banner.degraded {
            background: linear-gradient(135deg, rgba(255, 212, 0, 0.15) 0%, rgba(255, 212, 0, 0.05) 100%);
            border: 1px solid rgba(255, 212, 0, 0.3);
        }

        .status-banner.partial_outage {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.15) 0%, rgba(255, 152, 0, 0.05) 100%);
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .status-banner.major_outage {
            background: linear-gradient(135deg, rgba(244, 33, 46, 0.15) 0%, rgba(244, 33, 46, 0.05) 100%);
            border: 1px solid rgba(244, 33, 46, 0.3);
        }

        .status-banner.maintenance {
            background: linear-gradient(135deg, rgba(29, 155, 240, 0.15) 0%, rgba(29, 155, 240, 0.05) 100%);
            border: 1px solid rgba(29, 155, 240, 0.3);
        }

        .status-banner.unknown {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.75rem;
            vertical-align: middle;
        }

        .status-icon.operational { background: var(--operational); box-shadow: 0 0 12px var(--operational); }
        .status-icon.degraded { background: var(--degraded); box-shadow: 0 0 12px var(--degraded); }
        .status-icon.partial_outage { background: var(--partial-outage); box-shadow: 0 0 12px var(--partial-outage); animation: pulse 2s infinite; }
        .status-icon.major_outage { background: var(--major-outage); box-shadow: 0 0 12px var(--major-outage); animation: pulse 1.5s infinite; }
        .status-icon.maintenance { background: var(--maintenance); box-shadow: 0 0 12px var(--maintenance); }
        .status-icon.unknown { background: var(--text-secondary); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-text.operational { color: var(--operational); }
        .status-text.degraded { color: var(--degraded); }
        .status-text.partial_outage { color: var(--partial-outage); }
        .status-text.major_outage { color: var(--major-outage); }
        .status-text.maintenance { color: var(--maintenance); }
        .status-text.unknown { color: var(--text-secondary); }

        .status-updated {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* Section */
        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        /* Components */
        .component-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .component-group-header {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .component-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .component-item:last-child {
            border-bottom: none;
        }

        .component-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .component-status.operational { background: var(--operational); box-shadow: 0 0 8px var(--operational); }
        .component-status.degraded { background: var(--degraded); }
        .component-status.partial_outage { background: var(--partial-outage); animation: pulse 1.5s infinite; }
        .component-status.major_outage { background: var(--major-outage); animation: pulse 1.5s infinite; }
        .component-status.maintenance { background: var(--maintenance); }
        .component-status.unknown { background: var(--text-secondary); }

        .component-info {
            flex: 1;
            min-width: 0;
        }

        .component-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .component-description {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .component-uptime {
            text-align: right;
        }

        .component-uptime-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--operational);
        }

        .component-uptime-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Uptime bars (90 days) */
        .uptime-bars {
            display: flex;
            gap: 2px;
            margin-top: 0.5rem;
            height: 28px;
        }

        .uptime-bar {
            flex: 1;
            border-radius: 2px;
            min-width: 2px;
            position: relative;
            cursor: pointer;
        }

        .uptime-bar.operational { background: var(--operational); }
        .uptime-bar.degraded { background: var(--degraded); }
        .uptime-bar.partial_outage { background: var(--partial-outage); }
        .uptime-bar.major_outage { background: var(--major-outage); }
        .uptime-bar.maintenance { background: var(--maintenance); }
        .uptime-bar.unknown { background: var(--bg-tertiary); }
        .uptime-bar.no-data { background: var(--bg-tertiary); }

        .uptime-bar:hover::after {
            content: attr(data-date);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid var(--border-color);
        }

        .uptime-legend {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Incidents */
        .incident-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .incident-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .incident-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .incident-impact {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .incident-impact.minor { background: rgba(255, 212, 0, 0.2); color: var(--degraded); }
        .incident-impact.major { background: rgba(255, 152, 0, 0.2); color: var(--partial-outage); }
        .incident-impact.critical { background: rgba(244, 33, 46, 0.2); color: var(--major-outage); }

        .incident-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .incident-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .incident-updates {
            padding: 0;
        }

        .incident-update {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            padding-left: 2.5rem;
        }

        .incident-update:last-child {
            border-bottom: none;
        }

        .incident-update::before {
            content: '';
            position: absolute;
            left: 1rem;
            top: 1.5rem;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .incident-update::after {
            content: '';
            position: absolute;
            left: calc(1rem + 3px);
            top: 2rem;
            width: 2px;
            height: calc(100% - 1.5rem);
            background: var(--border-color);
        }

        .incident-update:last-child::after {
            display: none;
        }

        .incident-update.investigating::before { background: var(--degraded); }
        .incident-update.identified::before { background: var(--partial-outage); }
        .incident-update.monitoring::before { background: var(--maintenance); }
        .incident-update.resolved::before { background: var(--operational); }

        .incident-update-status {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .incident-update-status.investigating { color: var(--degraded); }
        .incident-update-status.identified { color: var(--partial-outage); }
        .incident-update-status.monitoring { color: var(--maintenance); }
        .incident-update-status.resolved { color: var(--operational); }

        .incident-update-message {
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .incident-update-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            margin-top: 2rem;
        }

        .footer a {
            color: var(--maintenance);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--maintenance);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error-state {
            text-align: center;
            padding: 4rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--major-outage);
            margin-bottom: 0.5rem;
        }

        .error-message {
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }

            .uptime-bars {
                height: 20px;
            }

            .component-uptime {
                display: none;
            }
        }
    </style>
</head>
<body class="standalone-page">
    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        const statusLabels = {
            operational: 'All Systems Operational',
            degraded: 'Degraded Performance',
            partial_outage: 'Partial System Outage',
            major_outage: 'Major System Outage',
            maintenance: 'Under Maintenance',
            unknown: 'Status Unknown'
        };

        const impactLabels = {
            none: 'None',
            minor: 'Minor',
            major: 'Major',
            critical: 'Critical'
        };

        function formatDate(date) {
            return new Date(date).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function formatTime(date) {
            return new Date(date).toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateUptimeBars(componentId) {
            // Generate 90 days of mock uptime data
            const bars = [];
            const today = new Date();
            for (let i = 89; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                // Random status with 95% operational
                const rand = Math.random();
                let status = 'operational';
                if (rand > 0.98) status = 'major_outage';
                else if (rand > 0.96) status = 'partial_outage';
                else if (rand > 0.94) status = 'degraded';

                bars.push(`<div class="uptime-bar ${status}" data-date="${dateStr}"></div>`);
            }
            return bars.join('');
        }

        function renderPage(data) {
            const { page, components, incidents, overall_status, updated_at } = data;

            document.title = `${page.name} - Status`;

            // Group components
            const groups = {};
            const ungrouped = [];
            (components || []).forEach(comp => {
                if (comp.group) {
                    if (!groups[comp.group]) groups[comp.group] = [];
                    groups[comp.group].push(comp);
                } else {
                    ungrouped.push(comp);
                }
            });

            let componentsHtml = '';

            // Render ungrouped first
            ungrouped.forEach(comp => {
                componentsHtml += renderComponent(comp);
            });

            // Render groups
            Object.keys(groups).sort().forEach(groupName => {
                componentsHtml += `<div class="component-group-header">${escapeHtml(groupName)}</div>`;
                groups[groupName].forEach(comp => {
                    componentsHtml += renderComponent(comp);
                });
            });

            // Render incidents
            let incidentsHtml = '';
            if (incidents && incidents.length > 0) {
                incidents.forEach(inc => {
                    incidentsHtml += renderIncident(inc);
                });
            }

            const html = `
                <header class="header">
                    ${page.logo_url ? `<img src="${escapeHtml(page.logo_url)}" alt="${escapeHtml(page.name)}" class="header-logo">` : ''}
                    <h1 class="header-title">${escapeHtml(page.name)}</h1>
                    ${page.description ? `<p class="header-description">${escapeHtml(page.description)}</p>` : ''}
                </header>

                <div class="status-banner ${overall_status}">
                    <span class="status-icon ${overall_status}"></span>
                    <span class="status-text ${overall_status}">${statusLabels[overall_status] || 'Unknown'}</span>
                    <div class="status-updated">Updated ${timeAgo(updated_at)}</div>
                </div>

                ${incidents && incidents.length > 0 ? `
                <section class="section">
                    <h2 class="section-title">Active Incidents</h2>
                    <div class="incident-list">
                        ${incidentsHtml}
                    </div>
                </section>
                ` : ''}

                <section class="section">
                    <h2 class="section-title">System Status</h2>
                    ${components && components.length > 0 ? `
                    <div class="component-list">
                        ${componentsHtml}
                    </div>
                    ` : `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128994;</div>
                        <p>No components configured</p>
                    </div>
                    `}
                </section>

                ${page.show_uptime !== false ? `
                <section class="section">
                    <h2 class="section-title">90-Day Uptime</h2>
                    <div class="component-list">
                        <div style="padding: 1rem;">
                            <div class="uptime-bars">
                                ${generateUptimeBars('overall')}
                            </div>
                            <div class="uptime-legend">
                                <span>90 days ago</span>
                                <span>Today</span>
                            </div>
                        </div>
                    </div>
                </section>
                ` : ''}

                <footer class="footer">
                    Powered by <a href="/">dogwatch</a>
                </footer>
            `;

            document.getElementById('content').innerHTML = html;
        }

        function renderComponent(comp) {
            const uptime = comp.uptime_30d || 100;
            return `
                <div class="component-item">
                    <div class="component-status ${comp.status || 'operational'}"></div>
                    <div class="component-info">
                        <div class="component-name">${escapeHtml(comp.name)}</div>
                        ${comp.description ? `<div class="component-description">${escapeHtml(comp.description)}</div>` : ''}
                    </div>
                    <div class="component-uptime">
                        <div class="component-uptime-value">${uptime.toFixed(2)}%</div>
                        <div class="component-uptime-label">30-day</div>
                    </div>
                </div>
            `;
        }

        function renderIncident(inc) {
            let updatesHtml = '';
            if (inc.updates && inc.updates.length > 0) {
                // Sort updates newest first
                const sortedUpdates = [...inc.updates].sort((a, b) =>
                    new Date(b.created_at) - new Date(a.created_at)
                );
                sortedUpdates.forEach(upd => {
                    updatesHtml += `
                        <div class="incident-update ${upd.status}">
                            <div class="incident-update-status ${upd.status}">${upd.status}</div>
                            <div class="incident-update-message">${escapeHtml(upd.message)}</div>
                            <div class="incident-update-time">${formatTime(upd.created_at)}</div>
                        </div>
                    `;
                });
            }

            return `
                <div class="incident-card">
                    <div class="incident-header">
                        <span class="incident-impact ${inc.impact || 'minor'}">${impactLabels[inc.impact] || 'Minor'} Impact</span>
                        <h3 class="incident-title">${escapeHtml(inc.title)}</h3>
                        <div class="incident-meta">Started ${formatTime(inc.created_at)}</div>
                    </div>
                    ${updatesHtml ? `<div class="incident-updates">${updatesHtml}</div>` : ''}
                </div>
            `;
        }

        function renderError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error-state">
                    <div class="error-title">Status Page Not Found</div>
                    <p class="error-message">${escapeHtml(message)}</p>
                </div>
            `;
        }

        // Get slug from URL path
        const pathParts = window.location.pathname.split('/');
        const slug = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

        // Fetch status page data
        fetch(`/status/${slug}/api`)
            .then(r => {
                if (!r.ok) throw new Error('Status page not found');
                return r.json();
            })
            .then(data => {
                renderPage(data);
            })
            .catch(err => {
                renderError(err.message);
            });

        // Auto-refresh every 60 seconds
        setInterval(() => {
            fetch(`/status/${slug}/api`)
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data) renderPage(data);
                })
                .catch(() => {});
        }, 60000);
    </script>
</body>
</html>
