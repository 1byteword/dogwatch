<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - dogwatch</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        :root {
            --bg: #0f1419;
            --bg-card: #16181c;
            --bg-elevated: #1e2128;
            --border: #2f3336;
            --text: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --success: #00ba7c;
            --error: #f4212e;
            --warning: #ffd400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, var(--bg) 100%);
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon { font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 600; }
        .logo span { color: var(--text-muted); font-size: 0.7rem; margin-left: 0.5rem; }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { border-color: var(--accent); }

        .container {
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .quick-links {
            display: flex;
            gap: 0.75rem;
        }

        .quick-link {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text);
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.15s;
        }

        .quick-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        log-explorer {
            flex: 1;
            min-height: 0;
        }

        /* Additional page-level styles for patterns and compare */
        .secondary-panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .pattern-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .pattern-item:hover {
            background: var(--bg-elevated);
        }

        .pattern-item:last-child {
            border-bottom: none;
        }

        .pattern-template {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pattern-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pattern-count {
            font-weight: 600;
            color: var(--text);
        }

        .compare-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .compare-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .compare-row label {
            width: 80px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .compare-row input,
        .compare-row select {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
        }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">&#128021;</span>
            <h1>dogwatch<span>Log Explorer</span></h1>
        </div>
        <nav style="display: flex; gap: 0.75rem;">
            <a href="/" class="btn">&#8592; Dashboard</a>
            <a href="/traces.html" class="btn">Traces</a>
            <a href="/lookout" class="btn">Lookout</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2 class="page-title">Log Explorer</h2>
            <div class="quick-links">
                <a href="#patterns" class="quick-link" onclick="togglePatterns()">&#128202; Log Patterns</a>
                <a href="#compare" class="quick-link" onclick="toggleCompare()">&#8596; Compare Periods</a>
                <a href="/api/logs?limit=1000&format=csv" class="quick-link" download>&#128229; Export CSV</a>
            </div>
        </div>

        <div class="main-panel">
            <log-explorer id="log-explorer"></log-explorer>
        </div>

        <div class="secondary-panels" id="secondary-panels" style="display: none;">
            <!-- Log Patterns Panel -->
            <div class="panel" id="patterns-panel" style="display: none;">
                <div class="panel-header">
                    <span>&#128202; Log Patterns (LogReduce)</span>
                    <button class="btn btn-sm" onclick="loadPatterns()">Refresh</button>
                </div>
                <div class="panel-body" id="patterns-list">
                    <div style="color: var(--text-muted); text-align: center; padding: 2rem;">
                        Click "Refresh" to analyze log patterns
                    </div>
                </div>
            </div>

            <!-- Log Compare Panel -->
            <div class="panel" id="compare-panel" style="display: none;">
                <div class="panel-header">
                    <span>&#8596; Log Compare</span>
                </div>
                <div class="panel-body">
                    <div class="compare-form">
                        <div class="compare-row">
                            <label>Period 1</label>
                            <select id="compare-period1">
                                <option value="1h">Last 1 hour</option>
                                <option value="6h">Last 6 hours</option>
                                <option value="24h" selected>Last 24 hours</option>
                            </select>
                        </div>
                        <div class="compare-row">
                            <label>Period 2</label>
                            <select id="compare-period2">
                                <option value="1h-2h">1-2 hours ago</option>
                                <option value="6h-12h">6-12 hours ago</option>
                                <option value="24h-48h" selected>24-48 hours ago</option>
                            </select>
                        </div>
                        <div class="compare-row">
                            <label>Service</label>
                            <select id="compare-service">
                                <option value="">All Services</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="runCompare()">
                            Compare Logs
                        </button>
                    </div>
                    <div id="compare-results" style="margin-top: 1rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/components/log-explorer.js"></script>
    <script>
        // Toggle patterns panel
        function togglePatterns() {
            const panel = document.getElementById('patterns-panel');
            const secondary = document.getElementById('secondary-panels');

            if (panel.style.display === 'none') {
                secondary.style.display = 'grid';
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
                checkSecondaryPanels();
            }
        }

        // Toggle compare panel
        function toggleCompare() {
            const panel = document.getElementById('compare-panel');
            const secondary = document.getElementById('secondary-panels');

            if (panel.style.display === 'none') {
                secondary.style.display = 'grid';
                panel.style.display = 'block';
                loadServicesForCompare();
            } else {
                panel.style.display = 'none';
                checkSecondaryPanels();
            }
        }

        // Check if any secondary panel is visible
        function checkSecondaryPanels() {
            const patterns = document.getElementById('patterns-panel');
            const compare = document.getElementById('compare-panel');
            const secondary = document.getElementById('secondary-panels');

            if (patterns.style.display === 'none' && compare.style.display === 'none') {
                secondary.style.display = 'none';
            }
        }

        // Load log patterns
        async function loadPatterns() {
            const list = document.getElementById('patterns-list');
            list.innerHTML = `
                <div style="text-align: center; padding: 1rem; color: var(--text-muted);">
                    <div class="spinner" style="display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                    <p style="margin-top: 0.5rem;">Analyzing patterns...</p>
                </div>
            `;

            try {
                const resp = await fetch('/api/logs/patterns');
                if (!resp.ok) throw new Error('Failed to load patterns');

                const data = await resp.json();
                const patterns = data.patterns || [];
                const totalLogs = data.total_logs || 1;

                if (!patterns.length) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
                            No patterns found. Ingest more logs to see patterns.
                        </div>
                    `;
                    return;
                }

                list.innerHTML = patterns.slice(0, 20).map(p => {
                    const pct = ((p.count || 0) / totalLogs * 100).toFixed(1);
                    const sample = p.sample_message || p.sample || '';
                    return `
                    <div class="pattern-item" onclick="searchPattern('${escapeHtml(p.template || '')}')">
                        <div class="pattern-template">${escapeHtml(p.template || 'Unknown pattern')}</div>
                        <div class="pattern-stats">
                            <span><span class="pattern-count">${p.count || 0}</span> occurrences</span>
                            <span>${pct}% of logs</span>
                            ${sample ? `<span style="color: var(--text-muted);">Sample: ${escapeHtml(sample.substring(0, 50))}...</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: var(--error);">
                        Error: ${e.message}
                    </div>
                `;
            }
        }

        // Search by pattern
        function searchPattern(template) {
            const explorer = document.getElementById('log-explorer');
            const searchInput = explorer.querySelector('#search-input');
            if (searchInput) {
                // Extract keywords from template
                const keywords = template.replace(/<\*>/g, '').trim().split(/\s+/).slice(0, 3).join(' ');
                searchInput.value = keywords;
                explorer.setFilter('query', keywords);
            }
        }

        // Load services for compare
        async function loadServicesForCompare() {
            try {
                const resp = await fetch('/api/logs/services');
                if (resp.ok) {
                    const services = await resp.json();
                    const select = document.getElementById('compare-service');
                    select.innerHTML = '<option value="">All Services</option>' +
                        services.map(s => `<option value="${s}">${s}</option>`).join('');
                }
            } catch (e) {
                console.error('Failed to load services:', e);
            }
        }

        // Run log compare
        async function runCompare() {
            const results = document.getElementById('compare-results');
            results.innerHTML = `
                <div style="text-align: center; padding: 1rem; color: var(--text-muted);">
                    Comparing logs...
                </div>
            `;

            try {
                const period1 = document.getElementById('compare-period1').value;
                const period2 = document.getElementById('compare-period2').value;
                const service = document.getElementById('compare-service').value;

                const params = new URLSearchParams({
                    period1,
                    period2
                });
                if (service) params.append('service', service);

                const resp = await fetch(`/api/logs/compare?${params}`);
                if (!resp.ok) throw new Error('Compare failed');

                const data = await resp.json();

                results.innerHTML = `
                    <div style="border: 1px solid var(--border); border-radius: 6px; overflow: hidden;">
                        <div style="display: flex; background: var(--bg-elevated); font-size: 0.8rem; font-weight: 600;">
                            <div style="flex: 1; padding: 0.5rem; border-right: 1px solid var(--border);">Period 1</div>
                            <div style="flex: 1; padding: 0.5rem;">Period 2</div>
                        </div>
                        <div style="display: flex; font-size: 0.8rem;">
                            <div style="flex: 1; padding: 0.75rem; border-right: 1px solid var(--border);">
                                <div style="font-size: 1.25rem; font-weight: 600;">${data.period1?.count || 0}</div>
                                <div style="color: var(--text-muted);">total logs</div>
                                <div style="margin-top: 0.5rem; color: var(--error);">${data.period1?.errors || 0} errors</div>
                            </div>
                            <div style="flex: 1; padding: 0.75rem;">
                                <div style="font-size: 1.25rem; font-weight: 600;">${data.period2?.count || 0}</div>
                                <div style="color: var(--text-muted);">total logs</div>
                                <div style="margin-top: 0.5rem; color: var(--error);">${data.period2?.errors || 0} errors</div>
                            </div>
                        </div>
                        ${data.new_patterns && data.new_patterns.length > 0 ? `
                            <div style="padding: 0.75rem; border-top: 1px solid var(--border);">
                                <div style="font-size: 0.75rem; color: var(--warning); margin-bottom: 0.5rem;">New patterns in Period 1:</div>
                                ${data.new_patterns.slice(0, 3).map(p => `
                                    <div style="font-family: monospace; font-size: 0.75rem; padding: 0.25rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                        ${escapeHtml(p)}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            } catch (e) {
                results.innerHTML = `
                    <div style="text-align: center; padding: 1rem; color: var(--error);">
                        Error: ${e.message}
                    </div>
                `;
            }
        }

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // CSS for spinner
        const style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
