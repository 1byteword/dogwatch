<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - dogwatch</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/logo.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --bg-card: #16181c;
            --bg-elevated: #1e2128;
            --border: #2f3336;
            --text: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --success: #00ba7c;
            --error: #f4212e;
            --warning: #ffd400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { border-color: var(--accent); }

        .container {
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .quick-links {
            display: flex;
            gap: 0.75rem;
        }

        .quick-link {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text);
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.15s;
        }

        .quick-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .main-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        log-explorer {
            flex: 1;
            min-height: 0;
        }

        /* Additional page-level styles for patterns and compare */
        .secondary-panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .pattern-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .pattern-item:hover {
            background: var(--bg-elevated);
        }

        .pattern-item:last-child {
            border-bottom: none;
        }

        .pattern-template {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pattern-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pattern-count {
            font-weight: 600;
            color: var(--text);
        }

        .compare-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .compare-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .compare-row label {
            width: 80px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .compare-row input,
        .compare-row select {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
        }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
            <div class="sidebar-header">
                <span class="logo-icon">&#128021;</span>
                <span class="logo-text">DOGWATCH</span>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="sidebar-item" data-tooltip="Dashboard">
                    <span class="icon">&#128200;</span>
                    <span class="label">Dashboard</span>
                </a>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Observability</div>
                    <a href="/traces.html" class="sidebar-item" data-tooltip="Traces">
                        <span class="icon">&#128279;</span>
                        <span class="label">Traces</span>
                    </a>
                    <a href="/logs.html" class="sidebar-item active" data-tooltip="Logs">
                        <span class="icon">&#128220;</span>
                        <span class="label">Logs</span>
                    </a>
                    <a href="/query-builder.html" class="sidebar-item" data-tooltip="Query">
                        <span class="icon">&#9889;</span>
                        <span class="label">Query</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Infrastructure</div>
                    <a href="/my-services" class="sidebar-item" data-tooltip="Services">
                        <span class="icon">&#128736;</span>
                        <span class="label">Services</span>
                    </a>
                    <a href="/entities" class="sidebar-item" data-tooltip="Entities">
                        <span class="icon">&#127970;</span>
                        <span class="label">Entities</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Monitoring</div>
                    <a href="/lookout" class="sidebar-item" data-tooltip="Lookout">
                        <span class="icon">&#128065;</span>
                        <span class="label">Lookout</span>
                    </a>
                    <a href="/bubbleup.html" class="sidebar-item" data-tooltip="BubbleUp">
                        <span class="icon">&#128200;</span>
                        <span class="label">BubbleUp</span>
                    </a>
                    <a href="/security.html" class="sidebar-item" data-tooltip="Security">
                        <span class="icon">&#128737;</span>
                        <span class="label">Security</span>
                    </a>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">System</div>
                    <a href="/admin.html" class="sidebar-item" data-tooltip="Admin">
                        <span class="icon">&#9881;</span>
                        <span class="label">Admin</span>
                    </a>
                    <a href="/settings.html" class="sidebar-item" data-tooltip="Settings">
                        <span class="icon">&#128295;</span>
                        <span class="label">Settings</span>
                    </a>
                    <a href="/import.html" class="sidebar-item" data-tooltip="Import">
                        <span class="icon">&#128230;</span>
                        <span class="label">Import</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar (Cmd+B)">
                    <span class="icon">&#9664;</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header-compact">
                <div class="header-left">
                    <span class="page-title">Log Explorer</span>
                </div>
                <div class="header-right">
                    <div class="quick-links" style="display: flex; gap: 0.5rem;">
                        <a href="#patterns" class="btn" onclick="togglePatterns(); return false;">&#128202; Patterns</a>
                        <a href="#compare" class="btn" onclick="toggleCompare(); return false;">&#8596; Compare</a>
                        <a href="/api/logs?limit=1000&format=csv" class="btn" download>&#128229; Export</a>
                    </div>
                </div>
            </header>

            <div class="container">

        <div class="main-panel">
            <log-explorer id="log-explorer"></log-explorer>
        </div>

        <div class="secondary-panels" id="secondary-panels" style="display: none;">
            <!-- Log Patterns Panel -->
            <div class="panel" id="patterns-panel" style="display: none;">
                <div class="panel-header">
                    <span>&#128202; Log Patterns (LogReduce)</span>
                    <button class="btn btn-sm" onclick="loadPatterns()">Refresh</button>
                </div>
                <div class="panel-body" id="patterns-list">
                    <div style="color: var(--text-muted); text-align: center; padding: 2rem;">
                        Click "Refresh" to analyze log patterns
                    </div>
                </div>
            </div>

            <!-- Log Compare Panel -->
            <div class="panel" id="compare-panel" style="display: none;">
                <div class="panel-header">
                    <span>&#8596; Log Compare</span>
                </div>
                <div class="panel-body">
                    <div class="compare-form">
                        <div class="compare-row">
                            <label>Period 1</label>
                            <select id="compare-period1">
                                <option value="1h">Last 1 hour</option>
                                <option value="6h">Last 6 hours</option>
                                <option value="24h" selected>Last 24 hours</option>
                            </select>
                        </div>
                        <div class="compare-row">
                            <label>Period 2</label>
                            <select id="compare-period2">
                                <option value="1h-2h">1-2 hours ago</option>
                                <option value="6h-12h">6-12 hours ago</option>
                                <option value="24h-48h" selected>24-48 hours ago</option>
                            </select>
                        </div>
                        <div class="compare-row">
                            <label>Service</label>
                            <select id="compare-service">
                                <option value="">All Services</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="runCompare()">
                            Compare Logs
                        </button>
                    </div>
                    <div id="compare-results" style="margin-top: 1rem;"></div>
                </div>
            </div>
        </div>
            </div>
        </main>
    </div>

    <script src="/js/components/log-explorer.js"></script>
    <script>
        // Sidebar Resize
        (function() {
            const sidebar = document.getElementById('sidebar');
            const handle = document.getElementById('sidebar-resize-handle');
            const mainContent = document.querySelector('.main-content');

            let isResizing = false;
            let startX, startWidth;

            // Restore saved width
            const savedWidth = localStorage.getItem('sidebar-width');
            if (savedWidth) {
                const width = parseInt(savedWidth);
                if (width <= 56) {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                } else {
                    sidebar.classList.remove('collapsed');
                    sidebar.style.setProperty('--sidebar-width', savedWidth + 'px');
                    mainContent.style.marginLeft = savedWidth + 'px';
                }
            }

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                document.body.classList.add('sidebar-resizing');
                handle.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const diff = e.clientX - startX;
                let newWidth = startWidth + diff;
                if (newWidth < 80) {
                    newWidth = 56;
                    sidebar.classList.add('collapsed');
                } else {
                    sidebar.classList.remove('collapsed');
                    newWidth = Math.min(300, Math.max(120, newWidth));
                }
                sidebar.style.setProperty('--sidebar-width', newWidth + 'px');
                mainContent.style.marginLeft = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.classList.remove('sidebar-resizing');
                    handle.classList.remove('dragging');
                    localStorage.setItem('sidebar-width', sidebar.offsetWidth);
                }
            });

            // Toggle function
            window.toggleSidebar = function() {
                if (sidebar.classList.contains('collapsed')) {
                    sidebar.classList.remove('collapsed');
                    const saved = localStorage.getItem('sidebar-width');
                    const width = (saved && parseInt(saved) > 56) ? saved : 200;
                    sidebar.style.setProperty('--sidebar-width', width + 'px');
                    mainContent.style.marginLeft = width + 'px';
                    localStorage.setItem('sidebar-width', width);
                } else {
                    sidebar.classList.add('collapsed');
                    sidebar.style.setProperty('--sidebar-width', '56px');
                    mainContent.style.marginLeft = '56px';
                    localStorage.setItem('sidebar-width', 56);
                }
            };

            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
                    e.preventDefault();
                    window.toggleSidebar();
                }
            });
        })();
    </script>
    <script>
        // Toggle patterns panel
        function togglePatterns() {
            const panel = document.getElementById('patterns-panel');
            const secondary = document.getElementById('secondary-panels');

            if (panel.style.display === 'none') {
                secondary.style.display = 'grid';
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
                checkSecondaryPanels();
            }
        }

        // Toggle compare panel
        function toggleCompare() {
            const panel = document.getElementById('compare-panel');
            const secondary = document.getElementById('secondary-panels');

            if (panel.style.display === 'none') {
                secondary.style.display = 'grid';
                panel.style.display = 'block';
                loadServicesForCompare();
            } else {
                panel.style.display = 'none';
                checkSecondaryPanels();
            }
        }

        // Check if any secondary panel is visible
        function checkSecondaryPanels() {
            const patterns = document.getElementById('patterns-panel');
            const compare = document.getElementById('compare-panel');
            const secondary = document.getElementById('secondary-panels');

            if (patterns.style.display === 'none' && compare.style.display === 'none') {
                secondary.style.display = 'none';
            }
        }

        // Load log patterns
        async function loadPatterns() {
            const list = document.getElementById('patterns-list');
            list.innerHTML = `
                <div style="text-align: center; padding: 1rem; color: var(--text-muted);">
                    <div class="spinner" style="display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                    <p style="margin-top: 0.5rem;">Analyzing patterns...</p>
                </div>
            `;

            try {
                const resp = await fetch('/api/logs/patterns');
                if (!resp.ok) throw new Error('Failed to load patterns');

                const data = await resp.json();
                const patterns = data.patterns || [];
                const totalLogs = data.total_logs || 1;

                if (!patterns.length) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
                            No patterns found. Ingest more logs to see patterns.
                        </div>
                    `;
                    return;
                }

                list.innerHTML = patterns.slice(0, 20).map(p => {
                    const pct = ((p.count || 0) / totalLogs * 100).toFixed(1);
                    const sample = p.sample_message || p.sample || '';
                    return `
                    <div class="pattern-item" onclick="searchPattern('${escapeHtml(p.template || '')}')">
                        <div class="pattern-template">${escapeHtml(p.template || 'Unknown pattern')}</div>
                        <div class="pattern-stats">
                            <span><span class="pattern-count">${p.count || 0}</span> occurrences</span>
                            <span>${pct}% of logs</span>
                            ${sample ? `<span style="color: var(--text-muted);">Sample: ${escapeHtml(sample.substring(0, 50))}...</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: var(--error);">
                        Error: ${e.message}
                    </div>
                `;
            }
        }

        // Search by pattern
        function searchPattern(template) {
            const explorer = document.getElementById('log-explorer');
            const searchInput = explorer.querySelector('#search-input');
            if (searchInput) {
                // Extract keywords from template
                const keywords = template.replace(/<\*>/g, '').trim().split(/\s+/).slice(0, 3).join(' ');
                searchInput.value = keywords;
                explorer.setFilter('query', keywords);
            }
        }

        // Load services for compare
        async function loadServicesForCompare() {
            try {
                const resp = await fetch('/api/logs/services');
                if (resp.ok) {
                    const services = await resp.json();
                    const select = document.getElementById('compare-service');
                    select.innerHTML = '<option value="">All Services</option>' +
                        services.map(s => `<option value="${s}">${s}</option>`).join('');
                }
            } catch (e) {
                console.error('Failed to load services:', e);
            }
        }

        // Run log compare
        async function runCompare() {
            const results = document.getElementById('compare-results');
            results.innerHTML = `
                <div style="text-align: center; padding: 1rem; color: var(--text-muted);">
                    Comparing logs...
                </div>
            `;

            try {
                const period1 = document.getElementById('compare-period1').value;
                const period2 = document.getElementById('compare-period2').value;
                const service = document.getElementById('compare-service').value;

                const params = new URLSearchParams({
                    period1,
                    period2
                });
                if (service) params.append('service', service);

                const resp = await fetch(`/api/logs/compare?${params}`);
                if (!resp.ok) throw new Error('Compare failed');

                const data = await resp.json();

                results.innerHTML = `
                    <div style="border: 1px solid var(--border); border-radius: 6px; overflow: hidden;">
                        <div style="display: flex; background: var(--bg-elevated); font-size: 0.8rem; font-weight: 600;">
                            <div style="flex: 1; padding: 0.5rem; border-right: 1px solid var(--border);">Period 1</div>
                            <div style="flex: 1; padding: 0.5rem;">Period 2</div>
                        </div>
                        <div style="display: flex; font-size: 0.8rem;">
                            <div style="flex: 1; padding: 0.75rem; border-right: 1px solid var(--border);">
                                <div style="font-size: 1.25rem; font-weight: 600;">${data.period1?.count || 0}</div>
                                <div style="color: var(--text-muted);">total logs</div>
                                <div style="margin-top: 0.5rem; color: var(--error);">${data.period1?.errors || 0} errors</div>
                            </div>
                            <div style="flex: 1; padding: 0.75rem;">
                                <div style="font-size: 1.25rem; font-weight: 600;">${data.period2?.count || 0}</div>
                                <div style="color: var(--text-muted);">total logs</div>
                                <div style="margin-top: 0.5rem; color: var(--error);">${data.period2?.errors || 0} errors</div>
                            </div>
                        </div>
                        ${data.new_patterns && data.new_patterns.length > 0 ? `
                            <div style="padding: 0.75rem; border-top: 1px solid var(--border);">
                                <div style="font-size: 0.75rem; color: var(--warning); margin-bottom: 0.5rem;">New patterns in Period 1:</div>
                                ${data.new_patterns.slice(0, 3).map(p => `
                                    <div style="font-family: monospace; font-size: 0.75rem; padding: 0.25rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                        ${escapeHtml(p)}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            } catch (e) {
                results.innerHTML = `
                    <div style="text-align: center; padding: 1rem; color: var(--error);">
                        Error: ${e.message}
                    </div>
                `;
            }
        }

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // CSS for spinner
        const style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
